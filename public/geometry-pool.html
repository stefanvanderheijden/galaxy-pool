<title>Geometry Pool feel rig</title>
<!--
  GEOMETRY POOL. Galaxy Table's table, flown Geometry Wars' way. 009 asked whether
  shooting and chasing a cue ball is a game; it answered yes and then made you fly an
  orbit to do it. This rig takes the orbit away. THE SHIP IS A CURSOR: it feels no
  gravity at all, it goes where the hand points, and every question about the shot is
  answered by stopping time instead of by flying a better approach.

  Three changes from 009, and everything else is 009's:
    1. NO BRIEFING. The rack is on screen the moment the page loads.
    2. THE SHIP IS FLOWN, NOT ORBITED, AND FLYING SPENDS TIME. Mouse: it flies to the
       cursor. Pad: the left stick is a direction and a throttle. Either way the throttle
       winds the CLOCK, not the engine. No thrust keys, no drift, no stabiliser.
    3. THE STAR IS A BLACK HOLE THAT LOOKS LIKE A STAR. Solaris is gone; CHARYBDIS sits
       in its place with the same 0.45 solar masses holding the rack in its rings, but
       with an event horizon. It is DRAWN as a sun (Galaxy 64's star card, the one 009
       gave Solaris) because that is what the table wants at its centre, and because a
       body falling into a star burning up is the same story 009 already told. It is not
       a ball and cannot be potted: it is the hazard at the middle of the table, and a
       world, a cue ball or the ship that crosses the horizon is GONE. The horizon is
       drawn as a dashed ring on the star's edge, since something that looks like scenery
       and behaves like a pocket has to say which it is.

  CONTROLS, MOUSE AND KEYBOARD
    MOUSE MOVE     the ship flies to the cursor, and the clock winds up with the
                   distance: far cursor, fast time, the rack whirling past you.
    LMB on the ship, drag, release
                   the aim. Pressing on the ship FREEZES TIME over freezeInS; drag away
                   from it to pull the cue back (direction is opposite the drag, power is
                   how far); release to shoot. Time comes back over thawOutS, which is
                   slower than the freeze on purpose: you watch the flash leave.
    Esc / RMB      cancel the aim, no shot, time returns
    Space          catch a ball in reach, or load the next one onto a bare nose
    Q / E hold     time slider, continuous. Drift returns it to game speed.
    C camera   R reset   P pause   H hide the panel   Scroll zoom

  CONTROLS, GAMEPAD (any XInput pad; press a button to wake it)
    LEFT STICK     fly. Direction and throttle, Geometry Wars: no facing, no inertia to
                   fight, let go and the ship stops in shipRampS. HOW FAR YOU PUSH IT IS
                   HOW FAST TIME RUNS, which is the pad's version of the distance rule.
    RIGHT STICK    aim. Pushing it past padAimDead FREEZES TIME exactly as the mouse
                   does; its angle is the shot and its throw is the power. LET THE STICK
                   GO and the shot fires along the last aim it held above padAimExit.
                   The two thresholds are not the same number on purpose: a stick
                   crossing back through its own deadzone reads as a garbage direction
                   for a frame or two, so the aim is LATCHED on the way out and the
                   release fires the latch, not whatever the stick said last.
    RT             fire now, without waiting for the stick to come home
    A              catch / new ball      B  cancel the aim
    LB / RB        time slider           START pause     BACK reset

  THE THROTTLE IS THE CLOCK. This is the whole idea of the rig and everything else
  follows from it. The ship is SLOW: shipSpeedAUyr is 3 AU/yr, and every world on the
  table is faster than that (Vera 3.5, Terra 4.4, Red 5.7). At the table's resting clock
  a 3 AU/yr ship crosses the screen in about three minutes, so it cannot get anywhere by
  going faster. It gets there by MAKING TIME PASS: the further the cursor is from the
  ship, the harder the clock is wound, up to travelBoostMax (x60, so 12,000,000x). The
  ship covers the table in about four seconds, and it does it by spending a YEAR of the
  rack's time to do it.

  So the cost of travel is not fuel, it is the rack. Fly across the table and Red goes
  round nearly twice while you are in the air (its year is 0.61 and it laps in 1.6
  seconds at full boost); the shot you could see when you set off is not the shot you
  have when you arrive. Park the cursor on the ship and the clock falls back to its
  resting pace, the rack settles, and you can read the table. Time flows when you move.

  BECAUSE THE SHIP IS SLOWER THAN THE WORLDS, the speed-up is legible. If the ship
  outran them, winding the clock would just make everything smear together and the eye
  would have no reference. At 3 AU/yr against Red's 5.7 the ship is always the slowest
  thing on the table, so when time opens up the worlds visibly pull away from it, and
  that is the readout: you can see how fast time is going by watching what the rack does
  next to you. Keep shipSpeedAUyr under 3.5 or the effect goes away.

  ARRIVAL COMES FREE. The boost is PROPORTIONAL to the distance left (d / travelRefAU,
  capped), so the ship's speed across the screen falls as it closes: that is an
  exponential approach with a time constant of about half a second, which cannot
  overshoot and cannot oscillate, and it needs no braking law of its own. It also means
  a small nudge and a full crossing take about the same time to settle, because both
  scale together. The boost is eased in LOG space, not linear: a clock is multiplicative
  and a linear ramp from 1x to 60x spends almost all of itself in the fast half and
  arrives as a jolt.

  THE AIM LINE HAS A HIERARCHY, and it is one sentence: THE CUE BALL IS SOLID WHITE AND
  LOUDEST, EVERYTHING ELSE IS A DASHED CONSEQUENCE IN ITS OWN COLOUR. 009 had this upside
  down. A struck world was drawn at 2.2 px and 0.75 alpha while the ball you were actually
  aiming was a 1 px dash at 0.45, so the faintest line on the table was the only one under
  your hand, and the loudest was a guess about what would happen afterwards. Now the cue
  ball is a solid 2 px white line over a soft halo, the world it strikes is a dashed line
  in the world's own colour beneath it, worlds already loose are quieter still, and cue
  balls already out are off unless asked for. Three redundant cues carry the difference:
  colour (white against the body's), weight, and solid against dashed.

  AND IT IS SHORT ON PURPOSE. Three things used to make it a tangle:
    · THE BANKS. With the terminus off a flash rebounds off the belt until it finds a
      ball, and drawing all eight put a web across the table that answered no question.
      forecastBounces (1) is how many banks the line will show; past that it stops at the
      cushion with a chevron saying it goes on. 0 stops it at the first cushion.
    · THE HORIZON, and there are now two of them, because a line and a marker are not
      the same kind of claim. The LINES stop at forecastAheadYr (0.3): past that a year
      of a chaotic rack is a drawing, not a prediction. The OUTCOMES keep looking to
      forecastFateYr (1.0), because "your cue ball ends up in the star" is precisely what
      you want to know before shooting, and a ring on the star costs nothing to read
      where a line across the table costs everything.
    · THE SECOND ORDER. A world knocking another world was drawn by default; it is the
      least trustworthy line on the table and the largest part of the mess.
      forecastKnockOn is off.

  WHAT REPLACED THE LENGTH is the thing the long lines were failing to say: a marker
  where a body's future actually ENDS. If a world is going into a pocket it gets POTTED
  on the pocket; over the horizon it gets SWALLOWED; the same for the cue ball. The line
  can then be short, because the outcome is not something you have to trace to find.

  THE POINTER IS THE RIG'S, not the operating system's. The canvas hides the system
  cursor and the rig draws one, in four states that say what the button will do: a
  DESTINATION crosshair out on the table (with the reticle at the far end of the trip and
  a hairline showing the trip itself), a GRAB bracket that closes on the hull when the
  pointer is over a ship with a ball ready, a REFUSED mark when the nose is bare, and a
  PULL mark while the cue is drawn. The navigation reticle disappears the moment the
  pointer is on the hull, so the two modes are never ambiguous: if you can see a
  destination, moving will fly there; if you can see brackets, pressing will aim.

  AND BECAUSE IT IS THE RIG'S, IT CAN BE PUT BACK. A pull-back shot drags the pointer a
  long way off the ship, and letting go there used to read as "now fly all the way over
  there", which is the opposite of what the hand meant: it meant "shoot". So on release
  (and on cancel) the pointer is moved onto the hull, the ship holds station, and you
  watch the shot instead of chasing the pointer. It is tracked as a virtual position
  moved by mouse DELTAS rather than read from clientX/clientY, which is what makes moving
  it possible at all; a stray re-entry into the window resets the delta origin rather
  than yanking the ship.

  THE SHOT IS ALWAYS WATCHED AT RESTING PACE. Pulling back to aim drags the cursor a
  long way off the ship, so on release the distance rule would slam the clock to x60
  exactly as the flash leaves. So the boost is pinned at 1 while any flash is in flight
  and for shotWatchS after the shot: you always see the shot at the pace it was designed
  at, and travel resumes once it has landed.

  THE SOFT WALL. The cursor's target is clamped inside the belt, and past the limit the
  outward part of the ship's desired velocity is cancelled and an inward push added. So
  the ship leans on the rim instead of flying through it into the rocks. The belt still
  wrecks the ship if you take it at speed through a gap-free stretch.

  FREEZING TIME. One number, timeScale, from 1 to 0 and back, eased exponentially and
  snapped at the ends. It multiplies the clock, so it slows the worlds, the balls, the
  ship and the ship's own steering together, and the forecast is built while it sits at
  0, which means the aim line is of the exact rack in front of you and not of a rack
  that has moved on by the time you let go. The freeze is fast (feels like the table
  catching its breath) and the thaw is slow (the shot leaves in slow motion, which is
  what the flash is for).

  THE SHOT is 009's, unchanged, and so is everything it touches: the flash at
  animeSpeedAUyr with a swept first contact, the impact frame, the shard cone, the
  honest forecast run on copies, the asteroid belt as a ring of one-time cushions, the
  three rim pockets, the chamber of three cue balls and their types.

  THE BELT IS FURTHER OUT than 009's, 3.2 AU rather than 2.7, and STYX EATS IS OFF by
  default. In 009 Styx sat at 2.45 with a 0.5 AU reach, which covered the belt from the
  first frame and started swallowing it before the first shot. Here the cushions are the
  wall the new flying leans on, so they last the rack. Turn styxEats on and Styx moves
  out to 2.75 where its reach does cover the belt, and the old clock comes back.

  WHAT WENT WITH THE ORBIT. No thrust keys, no zero-gravity drift, no thrustAntigrav, no
  linearDamp, no post-shot stabiliser, no recoil and no inherited ship velocity by
  default: the ship is not on a rail, so there is nothing to correct back onto, and a
  shot that bends because the cursor happened to be moving is a bug in a rig about aim.
  Both are still dials on the panel for anyone who wants the argument back.

  PORT NOTES, for Unity. The 009 notes still hold for the shot and the belt. New here:
    arrival steering    the same sqrt(2 a d) law, or NavMeshAgent with
                        autoBraking on and stoppingDistance 0
    twin stick          Input System, Gamepad.leftStick / rightStick, and read the
                        release as a value transition rather than a button
    freeze              Time.timeScale, with every feel timer on unscaledDeltaTime
    rumble              Gamepad.SetMotorSpeeds on impact, 0.12 s
-->
<style>
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
  /* NO SYSTEM POINTER. The rig draws its own, because the pointer here is not a pointer:
     it is a destination, and the rig needs to be able to MOVE it (back onto the ship
     after a shot). An arrow drawn by the OS cannot be moved and would sit somewhere else
     than the thing it is pointing with. See THE POINTER IS THE RIG'S in the header. */
  canvas { display: block; cursor: none; }
  #panel { position: fixed; top: 10px; right: 10px; width: 290px; background: rgba(8,12,22,0.86);
    border: 1px solid #2a3a55; border-radius: 6px; font: 11px/1.5 "Share Tech Mono", Menlo, monospace;
    color: #9fb4cc; padding: 10px 12px; user-select: none; max-height: calc(100vh - 40px); overflow-y: auto; }
  #panel h1 { font-size: 12px; margin: 0 0 6px; color: #cfe0ff; letter-spacing: 1px; display: flex; justify-content: space-between; }
  #panel #collapse { cursor: pointer; color: #6f86a8; }
  #panel .row { margin: 2px 0; }
  #panel label { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  #panel label span:first-child { flex: 1; line-height: 1.2; }
  #panel input[type=range] { width: 90px; flex: none; }
  #panel .val { width: 44px; text-align: right; color: #e2ecff; }
  #panel hr { border: 0; border-top: 1px solid #22304a; margin: 6px 0; }
  #chamber { position: fixed; left: 14px; bottom: 112px; display: flex; gap: 8px; font: 11px/1.4 "Share Tech Mono", Menlo, monospace; user-select: none; }
  #chamber .slot { width: 96px; background: rgba(8,12,22,0.8); border: 1px solid #2a3a55; border-radius: 6px; padding: 6px 8px; color: #9fb4cc; }
  #chamber .slot .lbl { font-size: 9px; letter-spacing: 1px; color: #6f86a8; }
  #chamber .slot .ball { display: flex; align-items: center; gap: 6px; margin: 4px 0 2px; }
  #chamber .slot .dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 6px rgba(255,255,255,0.25); }
  #chamber .slot .type { cursor: pointer; color: #cfe0ff; border-bottom: 1px dotted #4a5f80; }
  #chamber .slot .type:hover { color: #ffffff; }
  #chamber .slot.out .type, #chamber .slot.none .type { cursor: default; border-bottom: 0; color: #6f86a8; }
  #chamber .slot.active { border-color: #4fc3f7; }
  #panel button { background: #182640; color: #cfe0ff; border: 1px solid #2f4468; border-radius: 4px;
    font: inherit; padding: 3px 8px; cursor: pointer; width: 100%; }
</style>
</head>

      k.dead = true; flash(k.x, k.y, 0.25, "#ff8a3c"); burst(k.x, k.y, 0.1, "#ff8a3c");
      gone.push({ k, why: "CUE BALL LOST: over Charybdis' horizon" });
    }
  }
  if (gone.length) {
    balls = balls.filter(k => !k.dead);
    for (const g of gone) loseBall(g.why);
    if (acb.mode === "empty" && !score.failed) { acb.mode = "lost"; acb.lostT = 0; }
  }
  const beltI = S.beltKillsShip ? beltInside(ship.x, ship.y, HULL_LEN * 0.5, belt, simYears) : -1;
  if (beltI >= 0) { belt[beltI] = 0; beltBreak(beltI, ship.x, ship.y); }
  const shipHole = inHole(ship.x, ship.y, 0);
  if (beltI >= 0 || shipHole || pocketAt(ship.x, ship.y, 0)) {
    score.deaths++; flash(ship.x, ship.y, 0.3, "#ffffff");
    if (beltI >= 0) burst(ship.x, ship.y, 0.1, "#c8b090");
    if (shipHole) { burst(ship.x, ship.y, 0.15, "#ff8a3c"); fx.shake = Math.max(fx.shake, 0.9); }
    note(beltI >= 0 ? "SHIP LOST: wrecked on the asteroid belt"
       : shipHole ? "SHIP LOST: over Charybdis' horizon" : "SHIP LOST: pocketed", "#ff5030");
    rumble(0.9, 260);
    ship.x = SHIP_START.r * Math.cos(SHIP_START.a); ship.y = SHIP_START.r * Math.sin(SHIP_START.a);
    ship.vx = 0; ship.vy = 0; ship.trail = [];
    if (acb.mode === "capturing") { balls.push({ type: acb.type, x: acb.x, y: acb.y, vx: 0, vy: 0, trail: [], dwell: 0, lock: 0 }); acb.mode = "empty"; acb.cap = null; }
    aim = null;
  }
  if (!score.won && bodies.every(b => !b.alive)) { score.won = true; score.wonAt = simYears; note("TABLE CLEARED", "#ffe08a"); }
  return false;
}

// ============================== THE SHIP ========================================
// THE THROTTLE IS THE CLOCK. See the header. The ship's speed is honest and fixed at
// shipSpeedAUyr, slower than every world on the table; what changes with the hand is how
// fast TIME runs, and that is what carries the ship across. yrPerRealS is therefore the
// live rate, boost included, and everything below is "AU/yr changed per REAL second".
function yrPerRealS() { return warpNow() * travelBoost / SPY; }
function shipVmax() { return S.shipSpeedAUyr; }
function shipAccel() { return S.shipSpeedAUyr / Math.max(0.01, S.shipRampS); }
// How hard the clock WANTS to be wound this frame. The mouse asks with distance, the pad
// asks with stick throw, and a shot in the air overrules both so the flash is watched at
// the pace it was tuned at.
function travelBoostTarget() {
  if (aim || boostHold > 0 || hitstop) return 1;
  for (const k of balls) if (k.flash) return 1;
  if (pad.owns) return 1 + (S.travelBoostMax - 1) * pad.lmag;
  const t = cursorTarget();
  const d = Math.hypot(t[0] - ship.x, t[1] - ship.y);
  return Math.min(S.travelBoostMax, Math.max(1, d / Math.max(1e-6, S.travelRefAU)));
}
// Eased in LOG space: a clock is multiplicative, and a linear ramp from 1x to 60x spends
// nearly all of itself in the fast half and lands as a jolt. In log space the same ease
// reads as time smoothly opening up and smoothly closing again.
function stepBoost(realDt) {
  if (boostHold > 0) boostHold = Math.max(0, boostHold - realDt);
  const want = Math.max(1, travelBoostTarget());
  const k = 1 - Math.exp(-realDt / Math.max(0.02, S.boostEaseS));
  travelBoost = Math.exp(Math.log(travelBoost) + (Math.log(want) - Math.log(travelBoost)) * k);
  if (travelBoost < 1.001) travelBoost = 1;
}
function shipLimitAU() { return S.beltOn ? S.beltRadiusAU - BELT_HALF - S.wallMarginAU : S.viewRadiusAU; }
// How far the ship travels while stopping from full speed. The wall has to be at least
// this thick or a stick held outward walks straight through it into the rocks.
function stopDistAU() { const v = shipVmax(); return v * v * yrPerRealS() / (2 * shipAccel()); }

// THE SOFT WALL, and it is a BAND, not a line. Across the last stopping-distance before
// the limit the outward part of what the hand asked for is faded out, so the ship is
// already braking by the time it reaches the limit; past the limit an inward push is
// added as a backstop. A line here is not enough: the ship crosses a line in one frame
// at 0.06 AU a frame and only the desired velocity changes, never the actual one.
function contain(wx, wy) {
  const dx = ship.x - ORIGIN.x, dy = ship.y - ORIGIN.y, r = Math.hypot(dx, dy), lim = shipLimitAU();
  if (r < 1e-9) return [wx, wy];
  const band = Math.max(0.1, stopDistAU());
  if (r <= lim - band) return [wx, wy];
  const nx = dx / r, ny = dy / r;
  const t = Math.min(1, (r - (lim - band)) / band);      // 0 entering the band, 1 at the limit
  const out = wx * nx + wy * ny;
  if (out > 0) { wx -= nx * out * t; wy -= ny * out * t; }
  if (r > lim) { const push = Math.min(1, (r - lim) / 0.2) * shipVmax(); wx -= nx * push; wy -= ny * push; }
  return [wx, wy];
}
// Steer toward a desired velocity, capped by the engine. This is the only thing that
// ever changes the ship's velocity: there is no gravity on it by default and no damping.
function steerTo(wx, wy, realDt, scale) {
  const ex = wx - ship.vx, ey = wy - ship.vy, e = Math.hypot(ex, ey);
  if (e < 1e-12) return;
  const cap = shipAccel() * realDt * scale;
  const k = Math.min(1, cap / e);
  ship.vx += ex * k; ship.vy += ey * k;
}
// ARRIVAL. There is no braking law here any more and there does not need to be: the
// BOOST falls with the distance left, so the ship's speed across the screen falls with it
// and the approach is exponential. All this adds is a short taper inside the deadzone so
// the last hair of a move ends in a stop rather than a permanent creep.
function arriveVelocity(tx, ty) {
  const dx = tx - ship.x, dy = ty - ship.y, d = Math.hypot(dx, dy);
  const taper = Math.min(1, d / Math.max(1e-6, 2 * S.shipDeadAU));
  if (taper < 1e-3) return [0, 0];
  const want = shipVmax() * taper;
  return [dx / d * want, dy / d * want];
}
// The cursor's target, clamped inside the wall so the hand cannot ask for a wreck.
function cursorTarget() {
  let [tx, ty] = screenToWorld(mouse.sx, mouse.sy);
  const dx = tx - ORIGIN.x, dy = ty - ORIGIN.y, r = Math.hypot(dx, dy), lim = shipLimitAU();
  if (r > lim) { tx = ORIGIN.x + dx / r * lim; ty = ORIGIN.y + dy / r * lim; }
  return [tx, ty];
}
function flyShip(realDt) {
  // Frozen: the ship holds. The aim is of the table as it stands.
  if (timeScale < 0.02) return;
  let wx, wy;
  // WHICH HAND IS FLYING. Not "is a stick pushed" but "which did the player last use":
  // a released stick asks for a STOP, and falling back to the cursor on release would
  // send the ship off to wherever the mouse was last left. Moving the mouse takes it back.
  if (pad.owns) { wx = pad.lx * shipVmax(); wy = pad.ly * shipVmax(); }
  else { const t = cursorTarget(); [wx, wy] = arriveVelocity(t[0], t[1]); }
  [wx, wy] = contain(wx, wy);
  steerTo(wx, wy, realDt, timeScale);
}
// The hull points where it is going; while aiming it points along the shot, and it
// SNAPS there rather than easing, because the cue ball sits on the nose and an easing
// hull would drag the seat (and so the forecast) around under a frozen table.
function aimHull(realDt) {
  if (aim) { ship.nose = Math.atan2(aim.dir[1], aim.dir[0]); return; }
  const sp = Math.hypot(ship.vx, ship.vy);
  if (sp < 1e-6) return;
  ship.nose += angDiff(Math.atan2(ship.vy, ship.vx) - ship.nose) * Math.min(1, realDt * S.noseEase);
}
const HULL_LEN = 0.06;
function noseSeat() {
  const nx = Math.cos(ship.nose), ny = Math.sin(ship.nose);
  const off = HULL_LEN + S.acbRadiusAU;
  return [ship.x + nx * off, ship.y + ny * off, nx, ny];
}
function placeAcbOnNose() {
  const [x, y] = noseSeat();
  acb.x = x; acb.y = y; acb.vx = ship.vx; acb.vy = ship.vy;
}
function shipScreen() { return worldToScreen(ship.x, ship.y); }
function overShip(sx, sy) {
  const q = shipScreen();
  return Math.hypot(sx - q[0], sy - q[1]) < S.grabRadiusPx;
}

// ============================== THE AIM =========================================
// One entry point for both hands. Starting an aim is what freezes the clock; the clock
// itself is eased in the frame loop, so nothing here has to know about time.
function startAim(src) {
  if (acb.mode !== "attached" || score.failed || score.won) return false;
  aim = { src, dir: [Math.cos(ship.nose), Math.sin(ship.nose)], power: 0, held: 0 };
  // The clock collapses to resting pace HERE rather than easing down, because timeScale
  // is on its way to 0 in the same breath and nobody can see the snap. Easing it instead
  // would leave the boost still unwinding when the shot goes, and the flash would be
  // watched at whatever speed you happened to be travelling at when you pressed.
  travelBoost = 1;
  return true;
}
// Putting the pointer back on the hull is part of ending an aim, both ways: the pull
// left it out in the table and releasing it there would mean "fly there", not "shoot".
function pointerToShip() {
  const q = shipScreen();
  mouse.sx = q[0]; mouse.sy = q[1];
  mouse.over = true; mouse.held = false;
}
function cancelAim(why) {
  if (!aim) return;
  aim = null; pointerToShip();
  note("AIM CANCELLED" + (why ? ": " + why : ""), "#8fc3e8");
}
function releaseAim() {
  if (!aim) return;
  const { dir, power } = aim;
  aim = null; pointerToShip();
  if (power > 0.02) fireAcb(dir[0], dir[1], power);
  else note("NO SHOT: nothing pulled back", "#8fc3e8");
}
// The mouse rewrites the aim every frame from the pull vector: the shot is opposite the
// drag, measured from the SHIP rather than from where the click landed, so a click a few
// pixels off the hull does not tilt the whole shot.
function updateMouseAim(realDt) {
  if (!aim || aim.src !== "mouse") return;
  aim.held += realDt;
  const q = shipScreen();
  const vx = q[0] - mouse.sx, vy = q[1] - mouse.sy;
  const len = Math.hypot(vx, vy);
  if (len < 4) { aim.power = 0; return; }
  aim.dir = [vx / len, vy / len];
  aim.power = Math.min(1, len / S.dragMaxPx);
}
// What the shot WOULD be right now, for the forecast.
function pendingShot() {
  if (acb.mode !== "attached" || !aim) return null;
  return [aim.dir[0], aim.dir[1], aim.power];
}

// ============================== THE SHOT ========================================
function loseBall(why) {
  score.fouls++; score.lost++;
  const left = ballsLeft();
  note(why + " (foul, " + left + " left)", "#ff5030");
  if (left <= 0 && !score.won && !score.failed) { score.failed = true; note("TABLE FAILED: no cue balls left", "#ff5030"); }
}
function thermoGoesOff(ball, b) {
  thermoAftermath(ball, b);
  burst(ball.x, ball.y, 0.3, "#ffd23a"); burst(ball.x, ball.y, 0.18, "#ffffff"); flash(ball.x, ball.y, 0.5, "#ffd23a");
  fx.flashA = Math.max(fx.flashA, 0.6); fx.shake = Math.max(fx.shake, 0.7);
  note("THERMONUCLEAR DETONATED on " + b.name, "#ffd23a"); rumble(1, 240);
}
function flashHitsBall(k, o) {
  const [ivx, ivy] = impactVelocity(k); k.vx = ivx; k.vy = ivy;
  const dx = o.x - k.x, dy = o.y - k.y, d = Math.hypot(dx, dy) || 1, R = 2 * S.acbRadiusAU;
  k.x = o.x - dx / d * R * 0.995; k.y = o.y - dy / d * R * 0.995;
  collide(k, 1, S.acbRadiusAU, o, 1, S.acbRadiusAU);
  flash(k.x, k.y, 0.1, "#ffffff"); note("CUE BALLS COLLIDE", "#e8f0fa");
  fx.trails.push(k.flash.pts); k.flash = null;
  if (k.type === "thermo") thermoGoesOff(k, { name: "a cue ball" });
}
function fireAcb(dx, dy, power) {
  if (acb.mode !== "attached" || score.failed) return;
  const dv = power * S.shotPower;
  placeAcbOnNose();
  const k = { type: acb.type, x: acb.x, y: acb.y, vx: ship.vx * S.inheritFrac + dx * S.animeSpeedAUyr,
              vy: ship.vy * S.inheritFrac + dy * S.animeSpeedAUyr, trail: [], dwell: 0, lock: S.captureLockoutS,
              flash: { remain: flashRange(power), normalDv: dv, pts: [{ x: acb.x, y: acb.y, age: 0 }] } };
  burst(k.x, k.y, 0.12 + power * 0.1, "#dfffe8"); flash(k.x, k.y, 0.2 + power * 0.2, "#8fe8b0");
  fx.flashA = Math.max(fx.flashA, 0.35); fx.shake = Math.max(fx.shake, 0.4);
  balls.push(k);
  acb.mode = "empty";
  ship.vx -= dx * dv * S.recoilFrac; ship.vy -= dy * dv * S.recoilFrac;
  score.shots++;
  boostHold = S.shotWatchS;            // watch it leave at resting pace: see THE SHOT IS ALWAYS WATCHED
  note("SHOT " + score.shots + " at " + (power * 100).toFixed(0) + "%" + (S.captureLockoutS > 0 ? ", catchable in " + S.captureLockoutS + " s" : ""), "#e8f0fa");
  rumble(0.5 + power * 0.5, 120);
}

// ============================== THE CATCH =======================================
function catchable(k) {
  return dist(ship.x, ship.y, k.x, k.y) < S.captureRadiusAU && Math.hypot(ship.vx - k.vx, ship.vy - k.vy) < S.captureSpeed;
}
function checkCapture(realDt) {
  for (const k of balls) if (k.lock > 0) {
    k.lock -= realDt;
    if (k.lock <= 0) { k.lock = 0; note("BALL CAN BE CAUGHT", "#8fe8b0"); }
  }
  if (acb.mode === "capturing" || !S.autoCapture) return;
  for (const k of balls) {
    if (k.lock > 0) { k.dwell = 0; continue; }
    if (catchable(k)) k.dwell += realDt; else k.dwell = 0;
    if (k.dwell >= S.captureDwellS) { captureBall(k); return; }
  }
}
function captureBall(k) {
  const bare = acb.mode === "empty" || acb.mode === "lost";
  balls = balls.filter(o => o !== k);
  if (bare) {
    acb.mode = "capturing"; acb.type = k.type; acb.x = k.x; acb.y = k.y;
    acb.cap = { age: 0, sx: k.x - ship.x, sy: k.y - ship.y };
    note("CUE BALL CAUGHT: " + BALL_TYPES[k.type].name + " on the nose", "#8fe8b0"); rumble(0.3, 70);
  } else {
    chamber.push(k.type); flash(k.x, k.y, 0.12, "#8fe8b0");
    note("CUE BALL RECOVERED: " + BALL_TYPES[k.type].name + " chambered", "#8fe8b0"); rumble(0.3, 70);
  }
}
function spaceKey() {
  if (acb.mode === "capturing" || score.failed || score.won) return;
  let best = null, bd = 1e9;
  for (const k of balls) if (k.lock <= 0) { const d = dist(ship.x, ship.y, k.x, k.y); if (d < S.captureRadiusAU && d < bd) { bd = d; best = k; } }
  if (best) { captureBall(best); return; }
  newBallNow();
}
function stepCapture(realDt) {
  if (acb.mode !== "capturing") return;
  acb.cap.age += realDt;
  const t = Math.min(1, acb.cap.age / S.captureSeconds), e = easeInOutCubic(t);
  const [tx, ty] = noseSeat();
  acb.x = ship.x + acb.cap.sx + (tx - ship.x - acb.cap.sx) * e;
  acb.y = ship.y + acb.cap.sy + (ty - ship.y - acb.cap.sy) * e;
  acb.vx = ship.vx; acb.vy = ship.vy;
  if (t >= 1) { acb.mode = "attached"; acb.cap = null; placeAcbOnNose(); }
}
function newBallNow() {
  if (score.failed || score.won || acb.mode === "attached" || acb.mode === "capturing") return;
  if (!chamber.length) { note("CHAMBER EMPTY: catch a ball", "#e8b463"); return; }
  acb.type = chamber.shift();
  acb.mode = "attached"; acb.cap = null; placeAcbOnNose();
  note(BALL_TYPES[acb.type].name.toUpperCase() + " LOADED" + (balls.length ? " (" + balls.length + " out)" : ""), "#e8f0fa");
}
function stepLost(realDt) {
  if (acb.mode !== "lost" || score.failed) return;
  acb.lostT += realDt;
  if (acb.lostT >= S.respawnSeconds && chamber.length) newBallNow();
}
function flash(x, y, r, color) { flashes.push({ x, y, r, t: 0, color, kind: "ring" }); }
function burst(x, y, r, color) { flashes.push({ x, y, r, t: 0, color, kind: "flare", rot: Math.random() * TAU }); }

// ============================== THE IMPACT FRAME ================================
function beginImpactFrame(k, b) {
  hitstop = { t: S.animeHitstopMs / 1000, ball: k, planet: b };
  fx.flashA = 0.9; fx.shake = 0.5;
  const [ivx, ivy] = impactVelocity(k);
  const dir = Math.atan2(ivy, ivx);
  const lines = [];
  for (let i = 0; i < 18; i++) lines.push({ ang: dir + (Math.random() - 0.5) * 1.2, len: 0.12 + Math.random() * 0.4, w: 0.6 + Math.random() * 1.6 });
  fx.shards.push({ x: k.x, y: k.y, t: 0, lines });
  note("IMPACT: " + b.name, b.color); rumble(0.8, 140);
}
function endImpactFrame() {
  const { ball: k, planet: b } = hitstop; hitstop = null;
  const [ivx, ivy] = impactVelocity(k);
  k.vx = ivx; k.vy = ivy;
  const dx = b.x - k.x, dy = b.y - k.y, d = Math.hypot(dx, dy) || 1, R = S.acbRadiusAU + ballR(b);
  k.x = b.x - dx / d * R * 0.995; k.y = b.y - dy / d * R * 0.995;
  const boost = k.type === "thermo" ? Math.sqrt(S.thermoEnergy) : 1;
  k.vx *= boost; k.vy *= boost;
  collide(k, S.acbMassRatio * b.mass, S.acbRadiusAU, b, b.mass, ballR(b));
  if (!b.struck) { b.struck = true; note("STRUCK: " + b.name, b.color); }
  fx.shocks.push({ x: k.x, y: k.y, t: 0 });
  fx.shake = Math.max(fx.shake, 0.8);
  fx.trails.push(k.flash.pts); k.flash = null;
  if (k.type === "thermo") thermoGoesOff(k, b);
}
function stepFx(realDt) {
  for (const k of balls) if (k.flash) for (const q of k.flash.pts) q.age += realDt;
  for (const tr of fx.trails) for (const q of tr) q.age += realDt;
  fx.trails = fx.trails.filter(tr => tr.some(q => q.age < S.animeTrailS));
  for (const sh of fx.shards) sh.t += realDt;
  fx.shards = fx.shards.filter(sh => sh.t < 1.1);
  for (const sw of fx.shocks) sw.t += realDt;
  fx.shocks = fx.shocks.filter(sw => sw.t < 0.7);
  fx.flashA *= Math.exp(-12 * realDt);
  fx.shake *= Math.exp(-8 * realDt);
  fx.shakeX = (Math.random() - 0.5) * fx.shake * 24; fx.shakeY = (Math.random() - 0.5) * fx.shake * 24;
}

// ============================== THE FORECAST ====================================
// 009's forecast, on copies, minus the star: Charybdis is not a body the ball can hit,
// so the only thing the horizon does here is end a line.
function buildGhost() {
  const sim = [];
  let pending = null;
  const p = pendingShot();
  if (p) {
    const [x, y] = noseSeat();
    const dv = p[2] * S.shotPower;
    pending = { type: acb.type, x, y, vx: ship.vx * S.inheritFrac + p[0] * S.animeSpeedAUyr,
                vy: ship.vy * S.inheritFrac + p[1] * S.animeSpeedAUyr, pts: [{ x, y }], dead: false,
                flash: { remain: flashRange(p[2]), normalDv: dv, pts: [] } };
    sim.push(pending);
  }
  for (const k of balls) sim.push({ type: k.type, x: k.x, y: k.y, vx: k.vx, vy: k.vy, pts: [{ x: k.x, y: k.y }], dead: false,
                                    flash: k.flash ? { remain: k.flash.remain, normalDv: k.flash.normalDv, pts: [] } : null });
  if (!sim.length) { ghost = null; return; }
  const gb = bodies.map(b => ({ ...b, trail: null }));
  const gbelt = belt.slice();
  let gt = simYears;
  const out = { pending: null, hit: null, terminus: null, swallow: null, cut: null, fates: [], balls: [], worlds: [] };
  // `swallow` is kept only for the rig's own state readout; the drawing uses `fates`.
  const track = new Map();
  for (const b of gb) if (b.struck && b.alive) track.set(b.id, { color: b.color, pts: [{ x: b.x, y: b.y }] });
  for (const k of sim) {
    if (!k.flash) continue;
    sweepTime = gt; sweepSections = gbelt;
    let hit = null, bounces = 0, cut = false;
    // THE AIM LINE STOPS AT A CUSHION once it has shown the banks it is allowed to. With
    // the terminus off a flash rebounds until it finds a ball, and drawing all of that put
    // an eight-sided web over the table that answered no question anyone was asking.
    for (;;) {
      hit = sweepBall(k, gb, sim, Math.min(k.flash.remain, exitDistance(k) + 1e-3) / Math.hypot(k.vx, k.vy));
      k.pts.push({ x: k.x, y: k.y });
      if (hit && hit.belt) {
        if (bounces >= S.forecastBounces) { cut = true; hit = null; break; }
        flashBounce(k, hit, gbelt, true); bounces++; hit = null; continue;
      }
      if (!hit && !offTable(k) && k.flash.remain > 1e-6) continue;
      break;
    }
    if (cut) {
      // Cut here, and cut for good: flying it on would draw the very tangle we removed.
      if (k === pending) out.cut = { x: k.x, y: k.y, a: Math.atan2(k.vy, k.vx) };
      k.flash = null; k.dead = true;
      continue;
    }
    if (hit && hit.ball) {
      const o = hit.ball;
      if (k === pending) out.hit = { x: k.x, y: k.y };
      const [ivx, ivy] = impactVelocity(k); k.vx = ivx; k.vy = ivy;
      const dx = o.x - k.x, dy = o.y - k.y, d = Math.hypot(dx, dy) || 1, R = 2 * S.acbRadiusAU;
      k.x = o.x - dx / d * R * 0.995; k.y = o.y - dy / d * R * 0.995;
      collide(k, 1, S.acbRadiusAU, o, 1, S.acbRadiusAU);
      k.flash = null;
      if (k.type === "thermo") k.dead = true;
      continue;
    }
    if (hit) {
      if (k === pending) out.hit = { x: k.x, y: k.y };

  const g = gravityAt(acb.x, acb.y, S.acbFeelsWorlds);
  const gravV = [g.ax * S.gravityHorizonYr, g.ay * S.gravityHorizonYr];
  const t1 = [ax0 + shipV[0] * k, ay0 + shipV[1] * k];
  const t2 = [t1[0] + cueV[0] * k, t1[1] + cueV[1] * k];
  const tg = [ax0 + gravV[0] * k, ay0 + gravV[1] * k];
  const n = S.arrowNumbers;
  if (Math.hypot(shipV[0], shipV[1]) * k > 3) {
    arrow(ax0, ay0, t1[0], t1[1], "#4fc3f7", 2);
    const side = (a, b, sgn) => { const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
      return [(a[0] + b[0]) / 2 - dy / L * 14 * sgn, (a[1] + b[1]) / 2 + dx / L * 14 * sgn]; };
    const sm = side([ax0, ay0], t1, 1);
    arrowLabel(sm[0], sm[1], "ship" + (n ? " " + Math.hypot(...shipV).toFixed(1) + " AU/yr" : ""), "#4fc3f7");
  }
  arrow(ax0, ay0, t2[0], t2[1], "#8fe8b0", 2, [5, 4]);
  arrow(ax0, ay0, tg[0], tg[1], "#ffa040", 2);
  if (n) arrowLabel(t2[0], t2[1], Math.hypot(shipV[0] + cueV[0], shipV[1] + cueV[1]).toFixed(1) + " AU/yr", "#8fe8b0");
  arrowLabel(tg[0], tg[1] + 14, "gravity: " + g.top + (n ? " +" + Math.hypot(...gravV).toFixed(2) + " AU/yr in " + S.gravityHorizonYr + " yr" : ""), "#ffa040");
}

let chamberKey = "";
function renderChamber() {
  const slots = [];
  const noseHas = acb.mode === "attached" || acb.mode === "capturing";
  slots.push(noseHas ? { lbl: "ON THE NOSE", type: acb.type, state: "active", idx: -1 }
                     : { lbl: "ON THE NOSE", type: null, state: acb.mode === "empty" ? "out" : "none", idx: -1,
                         text: acb.mode === "empty" ? "ball out" : "empty" });
  for (let i = 0; i < 2; i++) slots.push(i < chamber.length ? { lbl: "CHAMBER " + (i + 1), type: chamber[i], state: "", idx: i }
                                                             : { lbl: "CHAMBER " + (i + 1), type: null, state: "none", idx: i, text: balls.length ? "out" : "spent" });
  const key = JSON.stringify(slots);
  if (key === chamberKey) return;
  chamberKey = key;
  const el = document.getElementById("chamber");
  el.innerHTML = slots.map((sl, i) => {
    const T = sl.type ? BALL_TYPES[sl.type] : null;
    return `<div class="slot ${sl.state}" data-i="${i}"><div class="lbl">${sl.lbl}</div><div class="ball">` +
      (T ? `<div class="dot" style="background:radial-gradient(circle at 35% 35%, ${T.hi}, ${T.color} 55%, ${T.lo})"></div><span class="type">${T.short}</span>`
         : `<div class="dot" style="background:#1a2233;border:1px dashed #3a4a66"></div><span class="type">${sl.text}</span>`) +
      `</div></div>`;
  }).join("");
  el.querySelectorAll(".slot .type").forEach((t, i) => t.addEventListener("click", () => cycleSlot(slots[i])));
}
function cycleSlot(sl) {
  if (!sl.type) return;
  const next = TYPE_ORDER[(TYPE_ORDER.indexOf(sl.type) + 1) % TYPE_ORDER.length];
  if (sl.idx < 0) { if (acb.mode !== "attached") return; acb.type = next; }
  else chamber[sl.idx] = next;
  note((sl.idx < 0 ? "NOSE" : "CHAMBER " + (sl.idx + 1)) + ": " + BALL_TYPES[next].name, "#cfe0ff");
}

const KEYMAP = { KeyQ: "q", KeyE: "e" };
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;

  if (e.code === "KeyC") { S.camFollow = !S.camFollow; saveSettings(); buildPanel(); }

});

addEventListener("blur", () => { for (const k in keys) keys[k] = false; mouse.client = null; cancelAim("focus lost"); });
// DELTAS, not absolutes. The rig owns the pointer's position (it moves it back onto the
// hull after a shot), so an absolute read would undo that on the very next event. Taking
// the delta ourselves rather than trusting movementX/Y keeps it working everywhere.
//
// ON THE WINDOW, IN THE CAPTURE PHASE, and that is not fussiness: the settings panel and
// the chamber are DOM elements sitting on top of the canvas, and a mousemove that lands
// on one of them never reaches a listener bound to the canvas. Bound there, a hand simply
// crossing the chamber on its way somewhere loses those events' deltas and the pointer
// arrives short of where the hand went, permanently and cumulatively. On the window it
// sees every event wherever it lands, so the pointer and the hand cannot drift apart.
//
// The one case that is NOT movement of the pointer is a drag on the panel's own controls:
// pulling a slider should not also fly the ship. That is tracked and skipped, while the
// delta origin still follows along so nothing is banked up to be applied later.
let uiDrag = false;
addEventListener("mousedown", e => {
  uiDrag = !!(e.target && e.target.closest && e.target.closest("#panel, #chamber"));
}, true);
addEventListener("mouseup", () => { uiDrag = false; }, true);
document.addEventListener("mouseleave", () => { mouse.client = null; });
addEventListener("mousemove", e => {
  if (!mouse.client) { mouse.client = { x: e.clientX, y: e.clientY }; return; }
  const dx = e.clientX - mouse.client.x, dy = e.clientY - mouse.client.y;
  mouse.client.x = e.clientX; mouse.client.y = e.clientY;
  if (uiDrag || (!dx && !dy)) return;
  mouse.sx = Math.max(0, Math.min(cv.clientWidth, mouse.sx + dx));
  mouse.sy = Math.max(0, Math.min(cv.clientHeight, mouse.sy + dy));
  mouse.held = true;                       // the hand has it now; stop gluing it to the hull
  if (pad.owns) { pad.owns = false; note("FLYING ON THE MOUSE", "#8fc3e8"); }
}, true);
cv.addEventListener("mousedown", e => {
  if (e.button === 2) { cancelAim("right click"); return; }
  if (e.button !== 0) return;
  if (S.grabAnywhere || overShip(mouse.sx, mouse.sy)) startAim("mouse");
  else note("AIM: press ON THE SHIP and pull back (grabAnywhere on the panel lifts this)", "#e8b463");
});
addEventListener("mouseup", e => { if (e.button === 0 && aim && aim.src === "mouse") releaseAim(); });

cv.addEventListener("wheel", e => { cam.zoom = Math.max(0.4, Math.min(6, cam.zoom * Math.exp(-e.deltaY * 0.0012))); e.preventDefault(); }, { passive: false });

function fmtLog(v) { return v < 100 ? v.toFixed(1) : v.toFixed(0); }
function buildPanel() {
  const el = document.getElementById("panel");
  let html = "";
  for (const row of PANEL) {
    if (row[0] === "h") { html += `<h1>${row[1]} <span id="collapse">[-]</span></h1><div id="panelBody">`; continue; }
    if (row[0] === "-") { html += "<hr>"; continue; }
    const [kind, key, label, min, max, step] = row;
    if (kind === "l") {
      const t = Math.log(S[key] / min) / Math.log(max / min);
      html += `<div class="row"><label><span>${label}</span><input type="range" data-k="${key}" data-log="${min},${max}" min="0" max="1" step="0.001" value="${t}"><span class="val" id="v_${key}">${fmtLog(S[key])}</span></label></div>`;
    } else if (kind === "b")
      html += `<div class="row"><label><span>${label}</span><input type="checkbox" data-k="${key}" ${S[key] ? "checked" : ""}></label></div>`;
    else
      html += `<div class="row"><label><span>${label}</span><input type="range" data-k="${key}" min="${min}" max="${max}" step="${step}" value="${S[key]}"><span class="val" id="v_${key}">${S[key]}</span></label></div>`;
  }
  html += `<hr><button id="resetBtn">reset to defaults</button></div>`;
  el.innerHTML = html;
  el.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", () => {
      const k = inp.dataset.k;
      let shown = inp.value;
      if (inp.dataset.log) {
        const [lo, hi] = inp.dataset.log.split(",").map(Number);
        S[k] = lo * Math.pow(hi / lo, parseFloat(inp.value));
        shown = fmtLog(S[k]);
      } else S[k] = inp.type === "checkbox" ? inp.checked : parseFloat(inp.value);
      if (k === "holeMass") STAR.mass = S.holeMass;
      const v = document.getElementById("v_" + k);
      if (v) v.textContent = shown;
      saveSettings();
    });
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    localStorage.removeItem(STORE_KEY); S = { ...DEFAULTS }; STAR.mass = S.holeMass; buildPanel();
  });
  document.getElementById("collapse").addEventListener("click", () => {
    const b = document.getElementById("panelBody");
    b.style.display = b.style.display === "none" ? "" : "none";
  });
}

                  balls: balls.map(k => ({ type: k.type, x: k.x, y: k.y, vx: k.vx, vy: k.vy, lock: k.lock, flash: !!k.flash })),
                  hitstop: hitstop ? { t: hitstop.t, planet: hitstop.planet.name } : null,
                  bodies: bodies.map(b => ({ name: b.name, x: b.x, y: b.y, vx: b.vx, vy: b.vy, alive: b.alive, struck: b.struck, broken: !!b.broken })),
                  pockets: POCKETS.map(p => ({ name: p.name, x: p.x, y: p.y })),
                  pad: { active: pad.active, owns: pad.owns, lmag: pad.lmag, rmag: pad.rmag },
                  pointer: { sx: mouse.sx, sy: mouse.sy, over: mouse.over, held: mouse.held },
                  score: { ...score }, notices: notices.map(n => n.text),
                  ghost: ghost ? { pts: ghost.pending ? ghost.pending.length : 0, hit: ghost.hit, swallow: ghost.swallow, balls: ghost.balls.length, worlds: ghost.worlds.length } : null }),
  settings: () => S,
  set: (k, v) => { S[k] = v; if (k === "holeMass") STAR.mass = v; },
  reset: resetWorld,
  setNose: a => { ship.nose = a; },
  fire: (dx, dy, p) => fireAcb(dx, dy, p),
  startAim: src => startAim(src || "mouse"),
  setAim: (dx, dy, p) => { if (aim) { aim.dir = [dx, dy]; aim.power = p; } },
  release: () => releaseAim(),
  cancel: () => cancelAim("rig"),
  setTimeScale: v => { timeScale = v; },
  boostNow: () => travelBoost,
  boostTarget: () => travelBoostTarget(),
  step: (yr) => { if (hitstop) return; const n = Math.ceil(yr / MAX_SUBSTEP_YR), h = yr / n; for (let i = 0; i < n; i++) if (simStep(h)) break; simYears += yr; if (acb.mode === "attached") placeAcbOnNose(); },
  endImpact: () => { if (hitstop) endImpactFrame(); },
  fxTick: (s) => stepFx(s),
  draw: () => draw(0.016),
  teleportShip: (x, y, vx, vy) => { ship.x = x; ship.y = y; ship.vx = vx; ship.vy = vy; },
  mouseTo: (sx, sy) => { mouse.sx = sx; mouse.sy = sy; mouse.held = true; mouse.over = overShip(sx, sy); },
  mouseBy: (dx, dy) => { mouse.sx = Math.max(0, Math.min(cv.clientWidth, mouse.sx + dx)); mouse.sy = Math.max(0, Math.min(cv.clientHeight, mouse.sy + dy)); },
  pointerAtShip: () => { const q = shipScreen(); return Math.hypot(mouse.sx - q[0], mouse.sy - q[1]); },
  fly: (s) => flyShip(s),
  arrive: (tx, ty) => arriveVelocity(tx, ty),
  contain: (wx, wy) => contain(wx, wy),
  key: (k, down) => { keys[k] = down; },
  newBall: () => newBallNow(),
  space: () => spaceKey(),
  ease: (s) => easeGhost(s),
  frame: (dtMs) => { manualFrame = true; last = performance.now() - dtMs; frame(performance.now()); manualFrame = false; },
  setType: (i, t) => { if (i < 0) acb.type = t; else chamber[i] = t; },
  teleportBody: (i, x, y, vx, vy, struck) => { const b = bodies[i]; b.x = x; b.y = y; b.vx = vx; b.vy = vy; if (struck != null) b.struck = struck; },
  ghostNow: () => { buildGhost(); return ghost ? { pts: ghost.pending ? ghost.pending.length : 0, hit: ghost.hit, swallow: ghost.swallow,
                    cut: ghost.cut, fates: ghost.fates.map(f => ({ kind: f.kind, name: f.name })),
                    balls: ghost.balls.length, worlds: ghost.worlds.length,
                    direct: ghost.worlds.filter(w => w.direct).length,
                    worldPts: ghost.worlds.reduce((a, w) => a + w.pts.length, 0) } : null; },
  realTick: (s) => { checkCapture(s); stepCapture(s); stepLost(s); },
  project: (x, y) => worldToScreen(x, y),
  cam: () => ({ ...cam }),
};

resetWorld();
requestAnimationFrame(frame);
</script>
</body>
