<title>Galaxy Table feel rig</title>
<!--
  GALAXY TABLE FEEL RIG. Galaxy Pool top-down with one design twist: the cue is in two
  parts. The ship carries a detachable ARTIFICIAL CELESTIAL BODY (the ACB) on its nose.
  It is white, and it is the cue ball. You ride your orbit, pick the moment, shoot the
  ACB off the nose, and the ACB knocks worlds into the pockets. Then you have to go and
  catch it again, and that chase is the flying. Every earlier rig struck with the ship
  or with a docked world; this one is a white ball, object balls and pockets on the rim,
  which is to say it is closer to actual pool. Double-click to run, like every mockup
  in this folder. Self-contained: the level-01 sprites are baked in as data URIs.

  THE LOOP
    1. The ship orbits the star with the ACB attached. Q/E slide time.
    2. Aim and shoot the ACB (two aim modes, Tab swaps them in play).
    3. The ACB hits a world; the world is knocked off its rail and feels the pockets.
    4. Fly to the ACB and catch it: inside the ring, slow enough, it winches back on.
    5. Repeat until the rack is clear.

  CONTROLS
    MOUSE          aim: the nose tracks the cursor (hyperwarp 2)
    W / S          drive forward / back along the nose
    A / D          strafe left / right of the nose
    Q / E hold     time slider, continuous 1x..5,000,000x
    Shift hold     zero gravity drift
    LMB            CHARGE mode: hold to charge, release to shoot along the nose
                   DRAG mode: press and pull back, release to shoot the other way
    Tab            swap CHARGE / DRAG
    Esc            cancel a charge or a drag
    C              camera: whole table / follow the ship
    Scroll         zoom    R  reset    P  pause    H  hide the settings panel

  FLYING is hyperwarp 2's: the nose chases the cursor, the keys are pure translation,
  and while the drive is on the ship answers the hand and gravity lets go (the panel can
  keep gravity on under thrust). Let go and the field owns the ship again with whatever
  velocity it has, which is how you settle into a new orbit, or fall into the star. The
  settle damping (linearDamp) is the same feel dial with the same warning: it is not
  physics, it is what stops you spending the whole game cancelling your last input.

  TWO DEVIATIONS FROM HYPERWARP, both because this is a table and not a corridor:
    · The time slider's centre is 1,000,000x, not 100,000x. The table is 2 AU across
      and the ship's orbit is 2.6 years round; at 100K that orbit takes 14 minutes.
      At 1M it takes 82 seconds, which is the pace a pool turn wants.
    · Thrust is 3000 AU/yr^2, not 9000, for the same reason. It began at 400, which
      played too slow once the resting speed came down to 200K.

  THE HIT IS A COLLISION, not a slingshot. ACB and world are two discs; contact resolves
  as an elastic collision along the normal with masses m_acb = acbMassRatio * m_world
  and a restitution the panel owns. Ratio 1 is real pool (the cue stops dead on a
  square hit); higher ploughs through. Struck worlds collide with each other the same
  way with their real masses, so a struck world can knock a second one loose.

  THE BALLS ARE BIG ON PURPOSE. drawR in level-01 is honest (0.0068 AU for Red) and at
  table scale that is one pixel. A pool ball is 1/45 of the table's width. ballScale
  multiplies every body's drawR for BOTH drawing and collision, with a floor, so the
  table reads as a table. This is display AND physics, and it is the one knowingly
  dishonest number: worlds with a radius of 0.05 AU are cartoons.

  POCKETS. Three black holes on the rim, 120 degrees apart at Styx's own radius, so
  the level's pocket is one of them and the other two are its mirrors. All three pull
  the ship and the ACB inside their influence radius. A world only feels them once
  struck, so the rack stays an authored set of rings until a shot breaks it.

  THE FORCE ARROWS. While you hold a shot the cue ball grows a free-body diagram: the
  ship's velocity it will keep (blue, inheritFrac of it), the resultant launch velocity (green, ship
  plus cue blast), and the gravity pull at the seat (orange) shown as the velocity it
  would add over the next 0.1 year, with the body that dominates it named. The cue
  blast itself is not drawn as an arrow: the cue stick already shows it, and a third
  arrow was too much. Labels name the source only; numbers are a panel toggle. Velocities and that gravity horizon share one pixel scale, so the
  lengths are comparable: near the star's ring gravity is a stub next to the cue, and
  next to a boosted world it is not, which is exactly the thing to see before shooting.

  THE STABILISER. A shot kicks the ship backwards (recoilFrac), which is honest and
  leaves you slowly falling out of your ring while you watch the ball. So after every
  shot the ship burns itself back onto a circular orbit at whatever radius it is at, with
  the same engine the hand flies, and says so in the log. Any WASD or Shift input is the
  manual override: it cancels the burn and the log says that too. Off on the panel.

  FOULS. The ACB into a pocket or the star is destroyed and a fresh one respawns on the
  nose after a few seconds; a world into the star is burned. Both count as fouls. Lose
  maxLostBalls cue balls (three) and the table is failed: no respawn, R to rack again. The
  ship into either respawns on its opening orbit. No timer, no energy, no fog, no scan,
  no rogue, no gas cloud, no Robert: a feel rig for one question, whether shooting and
  chasing a cue ball is better than shooting with the ship.
-->

// ============================== UNITS AND CONSTANTS =============================
const G = 4 * Math.PI * Math.PI;          // AU^3 / (Msun * yr^2), Kepler's third law
const SPY = 31557600;                      // seconds per Julian year
const MAX_SUBSTEP_YR = 1e-4;               // same rule as the game: fixed step ceiling
const MAX_SUBSTEPS = 200;                  // frame backstop: degrade, never freeze
const SOFT2 = 1e-6;                        // Plummer softening^2, matches SimUnits scale
// Log-linear in two halves with the centre PINNED. See the header: 1M here, not 100K.
// The centre is the panel's "game speed"; the fast end stays at least five times it.
function warpMid() { return S.gameSpeedK * 1000; }
function warpMax() { return Math.max(5e6, warpMid() * 5); }
const TAU = Math.PI * 2;

// ============================== TUNABLES (test panel) ===========================
const DEFAULTS = {
  dragMode: false,        // false: CHARGE (hold LMB), true: DRAG (pull back). Tab swaps
  thrustAntigrav: true,   // the drive lets go of gravity while it burns (hyperwarp 2)
  driftMode: true,        // the time slider springs home to 1M when released
  projections: true,      // the aim line and every struck world's forecast
  acbFeelsWorlds: true,   // the ACB flies the game layer (boosted worlds) like the ship
  planetsCollide: true,   // struck worlds knock each other
  camFollow: false,       // C toggles: whole table, or glide after the ship
  thrustAccel: 3000,      // AU/yr^2. The designer found 400 too slow at 200K; slider is log around this
  linearDamp: 0.9,        // settle per real second while off gravity. 0 = honest space
  aimEase: 24,            // how fast the nose swings to the cursor, per second
  shotPower: 8.0,         // AU/yr of delta-v at full charge / full pull
  chargeSeconds: 1.2,     // real seconds from empty to full charge
  dragMaxPx: 220,         // screen pixels of pull for a full-power drag shot
  recoilFrac: 0.15,       // fraction of the shot's delta-v the ship takes backwards
  // THE ONE DISHONEST NUMBER IN THE SHOT. A ball on the nose carries the ship's whole
  // velocity, and at 3.5 AU/yr on the ring that is half the cue blast: the shot goes
  // where the orbit says, not where you aim. So the ball keeps only this fraction of
  // the ship's velocity when it leaves. 1 is real physics.
  inheritFrac: 0.25,
  acbMassRatio: 1.0,      // m_acb / m_world in the collision. 1 = real pool
  restitution: 1.0,       // 1 = elastic
  ballScale: 10,          // drawR multiplier, drawing AND collision. See the header
  minBallAU: 0.05,        // floor under ballScale, so Vera is not a speck
  acbRadiusAU: 0.045,
  captureRadiusAU: 0.14,  // the ring around a free ACB the ship must be inside
  captureSpeed: 3.0,      // AU/yr of relative speed the ship must be under
  captureDwellS: 0.25,    // real seconds inside and slow before the winch starts
  captureSeconds: 1.25,   // real seconds of eased winch back onto the nose (001)
  pocketRadiusAU: 0.12,   // the pocket: capture radius of each black hole
  pocketInfluenceAU: 0.5, // level-01's influenceRadius
  pocketMass: 0.6,        // level-01's Styx
  planetBoost: 10000,     // the game layer's boost, unchanged: wells you can grab
  respawnSeconds: 3,      // a lost ACB comes back on the nose after this
  viewRadiusAU: 2.9,      // whole-table camera: half the short side, in AU
  gameSpeedK: 200,        // the clock's resting speed, in thousands of times real time
  maxLostBalls: 3,        // lose this many ACBs and the table is failed
  forceArrows: true,      // the free-body diagram on the cue ball while aiming
  arrowNumbers: false,    // label the arrows with values, not just their source
  arrowPxPerAUyr: 12,     // one pixel scale for every arrow, so they compare
  gravityHorizonYr: 0.1,  // gravity is drawn as the velocity it adds over this
  autoStabilise: true,    // burn back to a circular orbit after every shot
  stabiliseDoneAUyr: 0.05,// close enough: remaining velocity error that ends the burn
};
let S = loadSettings();

// ============================== WORLD ===========================================
// level-01 (Solaris), authored as intent (radius + angle) and derived, the same
// discipline as Sim.StableOrbit: never store raw state for an orbiting body. Angles
// are radians in screen convention, +y DOWN, as in the JSON.
const STAR = { x: 0, y: 0, mass: 0.45, drawR: 0.012, color: "#ff4b2b" };
const PLANET_DEFS = [
  { id: "smell",   name: "Red",   sprite: "red",       r: 0.55, a: 2.35,  mass: 4.1e-6,  drawR: 0.0068, color: "#d98c4a" },
  { id: "hearing", name: "Terra", sprite: "terra",     r: 0.92, a: 0.62,  mass: 1.55e-6, drawR: 0.0052, color: "#7fa8a0" },
  { id: "touch",   name: "Vera",  sprite: "vera",      r: 1.45, a: 5.583, mass: 4.2e-7,  drawR: 0.0038, color: "#cfd8e3" },
];
const SHIP_DEF = { r: 1.45, a: 3.927, overSpeed: 1.005 };
// Three pockets at Styx's radius, Styx first, the others 120 degrees round. Underworld
// rivers, because a pocket is where a world goes and does not come back from.
const STYX_A = Math.atan2(1.18, 1.72), STYX_R = Math.hypot(1.72, 1.18);
const POCKETS = [
  { name: "Styx",    a: STYX_A },
  { name: "Lethe",   a: STYX_A + TAU / 3 },
  { name: "Acheron", a: STYX_A + 2 * TAU / 3 },
].map(p => ({ name: p.name, x: STYX_R * Math.cos(p.a), y: STYX_R * Math.sin(p.a), color: "#b48cff" }));

let bodies, ship, acb, score, simYears;

function orbitState(r, a, over) {
  const v = Math.sqrt(G * STAR.mass / r) * (over || 1);
  return { x: STAR.x + r * Math.cos(a), y: STAR.y + r * Math.sin(a), vx: -v * Math.sin(a), vy: v * Math.cos(a) };
}
function derivePlanet(d) {
  return { ...orbitState(d.r, d.a), id: d.id, name: d.name, sprite: d.sprite, mass: d.mass, drawR: d.drawR,
           color: d.color, orbitR: d.r, struck: false, alive: true, trail: [], spin: Math.random() * TAU };
}
function ballR(b) { return Math.max(b.drawR * S.ballScale, S.minBallAU); }
function starR() { return Math.max(STAR.drawR * S.ballScale, 0.1); }

function resetWorld() {
  bodies = PLANET_DEFS.map(derivePlanet);
  const s = orbitState(SHIP_DEF.r, SHIP_DEF.a, SHIP_DEF.overSpeed);
  ship = { ...s, nose: Math.atan2(s.vy, s.vx), trail: [] };
  // The ACB: mode attached | free | capturing | lost. While attached it is placed on
  // the nose every step and carries the ship's velocity; only free does it integrate.
  acb = { mode: "attached", x: 0, y: 0, vx: 0, vy: 0, trail: [], dwell: 0, cap: null, lostT: 0 };
  placeAcbOnNose();
  score = { shots: 0, fouls: 0, potted: 0, burned: 0, deaths: 0, lost: 0, won: false, wonAt: 0, failed: false };
  simYears = 0;
  sliderT = 0.5; sliderShown = 0.5;   // open at the centre: 1M, the table's pace
  charging = false; charge = 0; drag = null; stab = null;
  ghost = null;
}

let paused = false;
let charging = false, charge = 0;
let drag = null;                            // {ax, ay} screen anchor while a DRAG shot is held
let stab = null;                            // { err } while the post-shot stabiliser burns
let flashes = [];
let notices = [];
const keys = {};
let mouse = { sx: 0, sy: 0 };
let cam = { x: 0, y: 0, scale: 200, zoom: 1 };
let ghost = null;                           // { acb: [pts], hit: {x,y}|null, worlds: [{color, pts}] }

function note(text, color) {
  notices.push({ text, color: color || "#9fb4cc", t: 0 });
  if (notices.length > 5) notices.shift();
}
function warpNow() {
  const mid = warpMid(), max = warpMax();
  return sliderT <= 0.5
    ? Math.pow(10, (sliderT / 0.5) * Math.log10(mid))
    : Math.pow(10, Math.log10(mid) + ((sliderT - 0.5) / 0.5) * Math.log10(max / mid));
}
function dist(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

// ============================== PHYSICS =========================================
// One softened point-mass kick, the exact Pull() shape from Sim.cs.
function pull(sx, sy, gm, b, h) {
  const dx = sx - b.x, dy = sy - b.y;
  const d2 = dx * dx + dy * dy + SOFT2;
  const k = gm * h / (d2 * Math.sqrt(d2));
  b.vx += dx * k; b.vy += dy * k;
}
function pullPockets(b, h) {
  for (const p of POCKETS) if (dist(b.x, b.y, p.x, p.y) < S.pocketInfluenceAU) pull(p.x, p.y, G * S.pocketMass, b, h);
}
// The REAL layer: a world feels the star, and the pockets once struck. Never another
// world's gravity (they collide instead), so an authored ring stays a ring.
function stepWorlds(list, h) {
  for (const b of list) {
    if (!b.alive) continue;
    pull(STAR.x, STAR.y, G * STAR.mass, b, h);
    if (b.struck) pullPockets(b, h);
  }
}
// The GAME layer: what the ship and the ACB fly on. Star, boosted worlds, pockets.
function gameGravity(o, list, h, feelWorlds) {
  pull(STAR.x, STAR.y, G * STAR.mass, o, h);
  if (feelWorlds) for (const b of list) if (b.alive) pull(b.x, b.y, G * b.mass * S.planetBoost, o, h);
  pullPockets(o, h);
}
// The game-layer acceleration at a point, and which body is most of it. For the arrows.
function gravityAt(x, y, feelWorlds) {
  const parts = [];
  const add = (name, bx, by, gm) => {
    const dx = bx - x, dy = by - y, d2 = dx * dx + dy * dy + SOFT2, k = gm / (d2 * Math.sqrt(d2));
    parts.push({ name, ax: dx * k, ay: dy * k, mag: gm / d2 });
  };
  add("Solaris", STAR.x, STAR.y, G * STAR.mass);
  if (feelWorlds) for (const b of bodies) if (b.alive) add(b.name, b.x, b.y, G * b.mass * S.planetBoost);
  for (const p of POCKETS) if (dist(x, y, p.x, p.y) < S.pocketInfluenceAU) add(p.name, p.x, p.y, G * S.pocketMass);
  let ax = 0, ay = 0, top = parts[0];
  for (const q of parts) { ax += q.ax; ay += q.ay; if (q.mag > top.mag) top = q; }
  return { ax, ay, top: top.name };
}
// Two discs meet: impulse along the normal, then separate them so they do not sink in.
// Returns true on contact. Masses are whatever the caller says they are.
function collide(a, ma, ra, b, mb, rb) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const d = Math.hypot(dx, dy), R = ra + rb;
  if (d >= R || d < 1e-12) return false;
  const nx = dx / d, ny = dy / d;
  const rel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;   // approach speed along n
  if (rel > 0) {
    const j = (1 + S.restitution) * rel / (1 / ma + 1 / mb);
    a.vx -= j / ma * nx; a.vy -= j / ma * ny;
    b.vx += j / mb * nx; b.vy += j / mb * ny;
  }
  const push = (R - d), wa = mb / (ma + mb), wb = ma / (ma + mb);
  a.x -= nx * push * wa; a.y -= ny * push * wa;
  b.x += nx * push * wb; b.y += ny * push * wb;
  return true;
}
// Every contact on the table for one step. Shared with the ghost, which is why it
// takes its actors as arguments and reports rather than scores.
function resolveContacts(list, ball, events) {
  const rA = S.acbRadiusAU;
  if (ball) for (const b of list) {
    if (!b.alive) continue;
    if (collide(ball, S.acbMassRatio * b.mass, rA, b, b.mass, ballR(b))) {
      if (!b.struck) { b.struck = true; events.push({ kind: "struck", b, x: b.x, y: b.y }); }
      else events.push({ kind: "hit", b, x: b.x, y: b.y });
    }
  }
  if (S.planetsCollide) for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const p = list[i], q = list[j];
    if (!p.alive || !q.alive || (!p.struck && !q.struck)) continue;
    if (collide(p, p.mass, ballR(p), q, q.mass, ballR(q))) {
      for (const w of [p, q]) if (!w.struck) { w.struck = true; events.push({ kind: "struck", b: w, x: w.x, y: w.y }); }
    }
  }
}
function pocketAt(x, y, r) { for (const p of POCKETS) if (dist(x, y, p.x, p.y) < S.pocketRadiusAU + r) return p; return null; }

function simStep(h, offGravity) {
  stepWorlds(bodies, h);
  if (!offGravity) gameGravity(ship, bodies, h, true);
  if (acb.mode === "free") gameGravity(acb, bodies, h, S.acbFeelsWorlds);
  for (const b of bodies) if (b.alive) { b.x += b.vx * h; b.y += b.vy * h; b.spin += h * 40; }
  ship.x += ship.vx * h; ship.y += ship.vy * h;
  if (acb.mode === "free") { acb.x += acb.vx * h; acb.y += acb.vy * h; }

  const events = [];
  resolveContacts(bodies, acb.mode === "free" ? acb : null, events);
  for (const e of events) {
    if (e.kind === "struck") { flash(e.x, e.y, 0.15, e.b.color); note("STRUCK: " + e.b.name, e.b.color); }
  }

  // Endings. A world into a pocket is the point; into the star is the foul.
  for (const b of bodies) {
    if (!b.alive) continue;
    const p = pocketAt(b.x, b.y, 0);
    if (p) {
      b.alive = false; score.potted++; flash(b.x, b.y, 0.3, "#b48cff"); burst(b.x, b.y, 0.12, "#b48cff");
      note("POTTED: " + b.name + " into " + p.name, "#b48cff");
    } else if (dist(b.x, b.y, STAR.x, STAR.y) < starR() + ballR(b) * 0.5) {
      b.alive = false; score.burned++; score.fouls++; flash(b.x, b.y, 0.25, "#ff5030"); burst(b.x, b.y, 0.1, "#ff5030");
      note("BURNED: " + b.name + " (foul)", "#ff5030");
    }
  }
  if (acb.mode === "free") {
    const p = pocketAt(acb.x, acb.y, 0);
    if (p || dist(acb.x, acb.y, STAR.x, STAR.y) < starR()) {
      acb.mode = "lost"; acb.lostT = 0; score.fouls++; score.lost++;
      flash(acb.x, acb.y, 0.2, "#ffffff"); burst(acb.x, acb.y, 0.08, "#ffffff");
      const left = S.maxLostBalls - score.lost;
      note((p ? "ACB LOST: pocketed in " + p.name : "ACB LOST: burned") + " (foul, " + Math.max(0, left) + " left)", "#ff5030");
      if (left <= 0 && !score.won) { score.failed = true; note("TABLE FAILED: no cue balls left", "#ff5030"); }
    }
  }
  if (pocketAt(ship.x, ship.y, 0) || dist(ship.x, ship.y, STAR.x, STAR.y) < starR()) {
    score.deaths++; flash(ship.x, ship.y, 0.3, "#ffffff");
    note("SHIP LOST: RESPAWNING", "#ff5030");
    const s = orbitState(SHIP_DEF.r, SHIP_DEF.a, SHIP_DEF.overSpeed);
    Object.assign(ship, s); ship.nose = Math.atan2(s.vy, s.vx); ship.trail = [];
    if (acb.mode === "capturing") { acb.mode = "free"; acb.cap = null; }
    charging = false; charge = 0; drag = null; stab = null;
  }
  if (!score.won && bodies.every(b => !b.alive)) { score.won = true; score.wonAt = simYears; note("TABLE CLEARED", "#ffe08a"); }
}

// ============================== THE SHIP ========================================
// THE HAND AIMS, THE DRIVE MOVES, and they are independent (hyperwarp 2). The nose
// chases the cursor except mid-drag, when it holds: a pull-back shot must not spin the
// hull under the cue.
function aimNose(realDt) {
  if (drag) return;
  const [mwx, mwy] = screenToWorld(mouse.sx, mouse.sy);
  const adx = mwx - ship.x, ady = mwy - ship.y;
  if (adx * adx + ady * ady > 1e-12) {
    const want = Math.atan2(ady, adx);
    let d = want - ship.nose;
    while (d > Math.PI) d -= TAU;
    while (d < -Math.PI) d += TAU;
    ship.nose += d * Math.min(1, realDt * S.aimEase);
  }
}
function thrustVector() {
  const nx = Math.cos(ship.nose), ny = Math.sin(ship.nose);
  const lon = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
  const lat = (keys.a ? 1 : 0) - (keys.d ? 1 : 0);
  // +y is down, so the left-hand normal of (nx, ny) is (ny, -nx): A goes to the
  // SCREEN's left. Check against the drawn hull rather than intuition.
  let fx = nx * lon + ny * lat, fy = ny * lon - nx * lat;
  const mag = Math.hypot(fx, fy);
  return mag > 1e-9 ? [fx / mag, fy / mag] : null;
}
function applyThrust(dtYr) {
  const f = thrustVector();
  if (!f) return;
  ship.vx += f[0] * S.thrustAccel * dtYr;
  ship.vy += f[1] * S.thrustAccel * dtYr;
}
const HULL_LEN = 0.06;   // AU, nose to the ACB's seat
function noseSeat() {
  const nx = Math.cos(ship.nose), ny = Math.sin(ship.nose);
  const off = HULL_LEN + S.acbRadiusAU;
  return [ship.x + nx * off, ship.y + ny * off, nx, ny];
}
function placeAcbOnNose() {
  const [x, y] = noseSeat();
  acb.x = x; acb.y = y; acb.vx = ship.vx; acb.vy = ship.vy;
}

// ============================== THE SHOT ========================================
// Both modes end here: a direction and a 0..1 power. The ACB leaves the seat with the
// ship's velocity plus the shot, and the ship takes recoilFrac of it backwards.
function fireAcb(dx, dy, power) {
  if (acb.mode !== "attached" || score.failed) return;
  const dv = power * S.shotPower;
  placeAcbOnNose();
  acb.vx = ship.vx * S.inheritFrac + dx * dv; acb.vy = ship.vy * S.inheritFrac + dy * dv;
  acb.mode = "free"; acb.trail = []; acb.dwell = 0;
  ship.vx -= dx * dv * S.recoilFrac; ship.vy -= dy * dv * S.recoilFrac;
  score.shots++;
  flash(acb.x, acb.y, 0.08 + power * 0.15, "#ffffff");
  note("SHOT " + score.shots + " at " + (power * 100).toFixed(0) + "%", "#e8f0fa");
  if (S.autoStabilise) { stab = { err: 1 }; note("STABILISER: correcting orbit after the shot", "#e8b463"); }
}
// ---- THE STABILISER --------------------------------------------------------------
// The circular-orbit velocity at the ship's current radius, keeping its sense of
// rotation, and one substep's worth of engine toward it. Runs inside the substep loop
// so it sees the same clock the hand's thrust does.
function stabiliseStep(h) {
  if (!stab) return;
  const dx = ship.x - STAR.x, dy = ship.y - STAR.y, r = Math.hypot(dx, dy);
  if (r < 1e-6) return;
  const v = Math.sqrt(G * STAR.mass / r);
  const cw = dx * ship.vy - dy * ship.vx >= 0 ? 1 : -1;     // sign of angular momentum
  const tx = -dy / r * v * cw, ty = dx / r * v * cw;
  const ex = tx - ship.vx, ey = ty - ship.vy, err = Math.hypot(ex, ey);
  stab.err = err;
  if (err < S.stabiliseDoneAUyr) { stab = null; note("STABILISER: orbit stable, holding", "#8fe8b0"); return; }
  const cap = S.thrustAccel * h;
  const k = Math.min(1, cap / err);
  ship.vx += ex * k; ship.vy += ey * k;
}
function overrideStabiliser(why) {
  if (!stab) return;
  stab = null; note("STABILISER: manual override (" + why + ")", "#e8b463");
}
// What the shot WOULD be right now, for the aim line: [dx, dy, power] or null.
function pendingShot() {
  if (acb.mode !== "attached") return null;
  if (S.dragMode) {
    if (!drag) return null;
    const vx = drag.ax - mouse.sx, vy = drag.ay - mouse.sy;   // pull back, shoot forward
    const len = Math.hypot(vx, vy);
    if (len < 4) return [Math.cos(ship.nose), Math.sin(ship.nose), 0];
    return [vx / len, vy / len, Math.min(1, len / S.dragMaxPx)];
  }
  return [Math.cos(ship.nose), Math.sin(ship.nose), charging ? charge : 1];
}

// ============================== THE CATCH =======================================
// Close and slow (galaxy-64's capture rule), then 001's eased approach: inside the ring
// under the relative speed for a short dwell, and the ACB winches onto the nose over
// captureSeconds in the ship's frame. The ship is what you fly; the ball is what moves.
function checkCapture(realDt) {
  if (acb.mode !== "free") return;
  const d = dist(ship.x, ship.y, acb.x, acb.y);
  const rel = Math.hypot(ship.vx - acb.vx, ship.vy - acb.vy);
  if (d < S.captureRadiusAU && rel < S.captureSpeed) acb.dwell += realDt;
  else acb.dwell = 0;
  if (acb.dwell >= S.captureDwellS) {
    acb.mode = "capturing";
    acb.cap = { age: 0, sx: acb.x - ship.x, sy: acb.y - ship.y };
    note("ACB CAPTURED", "#8fe8b0");
  }
}
function stepCapture(realDt) {
  if (acb.mode !== "capturing") return;
  acb.cap.age += realDt;
  const t = Math.min(1, acb.cap.age / S.captureSeconds), e = easeInOutCubic(t);
  const [tx, ty] = noseSeat();
  acb.x = ship.x + acb.cap.sx + (tx - ship.x - acb.cap.sx) * e;
  acb.y = ship.y + acb.cap.sy + (ty - ship.y - acb.cap.sy) * e;
  acb.vx = ship.vx; acb.vy = ship.vy;
  if (t >= 1) { acb.mode = "attached"; acb.cap = null; placeAcbOnNose(); }
}
function stepLost(realDt) {
  if (acb.mode !== "lost" || score.failed) return;
  acb.lostT += realDt;
  if (acb.lostT >= S.respawnSeconds) { acb.mode = "attached"; placeAcbOnNose(); acb.trail = []; note("NEW ACB ON THE NOSE", "#e8f0fa"); }
}

function flash(x, y, r, color) { flashes.push({ x, y, r, t: 0, color, kind: "ring" }); }
function burst(x, y, r, color) { flashes.push({ x, y, r, t: 0, color, kind: "flare", rot: Math.random() * TAU }); }

// ============================== THE FORECAST ====================================
// The aim line, and the honest one: the same step, the same contacts, the same masses
// as the real sim, run ahead from the shot that is pending (or from the ACB where it
// flies). It shows the ACB's line, the point of first contact, and where each struck
// world goes afterwards, which is the whole of aiming in pool. ~1 year of future.
function buildGhost() {
  let ball = null;
  if (acb.mode === "free") ball = { x: acb.x, y: acb.y, vx: acb.vx, vy: acb.vy };
  else {
    const p = pendingShot();
    if (!p) { ghost = null; return; }
    const [x, y] = noseSeat();
    ball = { x, y, vx: ship.vx * S.inheritFrac + p[0] * p[2] * S.shotPower, vy: ship.vy * S.inheritFrac + p[1] * p[2] * S.shotPower };
  }
  const gb = bodies.map(b => ({ ...b, trail: null }));
  const out = { acb: [{ x: ball.x, y: ball.y }], hit: null, worlds: [], ballDead: false };
  const track = new Map();
  for (const b of gb) if (b.struck && b.alive) track.set(b.id, { color: b.color, pts: [{ x: b.x, y: b.y }] });
  const H = 2e-4, N = 5000;
  for (let i = 0; i < N; i++) {
    stepWorlds(gb, H);
    if (!out.ballDead) gameGravity(ball, gb, H, S.acbFeelsWorlds);
    for (const b of gb) if (b.alive) { b.x += b.vx * H; b.y += b.vy * H; }
    if (!out.ballDead) { ball.x += ball.vx * H; ball.y += ball.vy * H; }
    const events = [];
    resolveContacts(gb, out.ballDead ? null : ball, events);
    for (const e of events) {
      if (!out.hit) out.hit = { x: e.x, y: e.y };
      if (!track.has(e.b.id)) track.set(e.b.id, { color: e.b.color, pts: [{ x: e.b.x, y: e.b.y }] });
    }
    for (const b of gb) {
      if (!b.alive) continue;
      if (pocketAt(b.x, b.y, 0) || dist(b.x, b.y, STAR.x, STAR.y) < starR() + ballR(b) * 0.5) b.alive = false;
    }
    if (!out.ballDead && (pocketAt(ball.x, ball.y, 0) || dist(ball.x, ball.y, STAR.x, STAR.y) < starR())) out.ballDead = true;
    if (i % 8 === 0) {
      if (!out.ballDead) out.acb.push({ x: ball.x, y: ball.y });
      for (const b of gb) { const t = track.get(b.id); if (t && b.alive) t.pts.push({ x: b.x, y: b.y }); }
    }
  }
  out.worlds = [...track.values()];
  ghost = out;
}

// ============================== FRAME ===========================================
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const realDt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (paused) { draw(realDt); return; }

  const SLIDE_RATE = 0.45;
  if (keys.q) sliderT = Math.max(0, sliderT - SLIDE_RATE * realDt);
  if (keys.e) sliderT = Math.min(1, sliderT + SLIDE_RATE * realDt);
  if (S.driftMode && !keys.q && !keys.e) sliderT += (0.5 - sliderT) * Math.min(1, realDt * 3);
  sliderShown += (sliderT - sliderShown) * Math.min(1, realDt * 10);
  const warp = warpNow();

  aimNose(realDt);
  if (charging) charge = Math.min(1, charge + realDt / S.chargeSeconds);

  const thrusting = !!thrustVector();
  if (stab && thrusting) overrideStabiliser("engine");
  if (stab && keys.shift) overrideStabiliser("zero gravity drift");
  const offGravity = keys.shift || (thrusting && S.thrustAntigrav);

  const dtYr = warp * realDt / SPY;
  const steps = dtYr > MAX_SUBSTEP_YR ? Math.min(MAX_SUBSTEPS, Math.ceil(dtYr / MAX_SUBSTEP_YR)) : 1;
  const h = dtYr / steps;
  for (let i = 0; i < steps; i++) { applyThrust(h); stabiliseStep(h); simStep(h, offGravity); }
  simYears += dtYr;

  // The settle, once per frame on the real clock, only while off gravity: game feel,
  // not physics, so never inside the substeps and never while the field owns the ship.
  if (S.linearDamp > 0 && offGravity) {
    const k = Math.exp(-S.linearDamp * realDt);
    ship.vx *= k; ship.vy *= k;
  }

  if (acb.mode === "attached") placeAcbOnNose();
  checkCapture(realDt);
  stepCapture(realDt);
  stepLost(realDt);

  pushTrail(ship.trail, ship.x, ship.y, 500);
  if (acb.mode === "free") pushTrail(acb.trail, acb.x, acb.y, 400);
  for (const b of bodies) if (b.alive && b.struck) pushTrail(b.trail, b.x, b.y, 300);

  if (S.projections) buildGhost(); else ghost = null;

  const tx = S.camFollow ? ship.x : STAR.x, ty = S.camFollow ? ship.y : STAR.y;
  cam.x += (tx - cam.x) * Math.min(1, realDt * 4);
  cam.y += (ty - cam.y) * Math.min(1, realDt * 4);
  const fit = Math.min(cv.clientWidth, cv.clientHeight) / 2 / S.viewRadiusAU;
  cam.scale += (fit * cam.zoom - cam.scale) * Math.min(1, realDt * 6);

  for (const f of flashes) f.t += realDt;
  flashes = flashes.filter(f => f.t < 0.8);
  for (const n of notices) n.t += realDt;
  notices = notices.filter(n => n.t < 20);

  draw(realDt);
}
function pushTrail(trail, x, y, cap) {
  const l = trail[trail.length - 1];
  if (l && dist(l.x, l.y, x, y) < 0.004) return;
  trail.push({ x, y });
  if (trail.length > cap) trail.shift();
}

// ============================== DRAWING =========================================
const cv = document.getElementById("cv");
const cx = cv.getContext("2d");
let DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1;
  cv.width = Math.floor(innerWidth * DPR); cv.height = Math.floor(innerHeight * DPR);
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
}
addEventListener("resize", resize); resize();
function worldToScreen(x, y) { return [(x - cam.x) * cam.scale + cv.clientWidth / 2, (y - cam.y) * cam.scale + cv.clientHeight / 2]; }
function screenToWorld(sx, sy) { return [(sx - cv.clientWidth / 2) / cam.scale + cam.x, (sy - cv.clientHeight / 2) / cam.scale + cam.y]; }

const stars = [];
for (let i = 0; i < 500; i++) stars.push({ x: Math.random(), y: Math.random(), a: 0.15 + Math.random() * 0.6, r: Math.random() < 0.1 ? 1.4 : 0.8 });

// Sprites: an Image per entry, and a tinted copy of the sun (level-01 paints Solaris red).
const IMG = {};
for (const k in SPRITES) { const im = new Image(); im.src = SPRITES[k].src; IMG[k] = im; }
let sunTinted = null;
IMG.sun.onload = () => {
  const c = document.createElement("canvas"); c.width = IMG.sun.width; c.height = IMG.sun.height;
  const g = c.getContext("2d");
  g.drawImage(IMG.sun, 0, 0);
  g.globalCompositeOperation = "multiply"; g.fillStyle = STAR.color; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = "destination-in"; g.drawImage(IMG.sun, 0, 0);
  sunTinted = c;
};
function drawSprite(key, sx, sy, R, img, alpha) {
  const sp = SPRITES[key], im = img || IMG[key];
  if (!im || !(im.complete || im instanceof HTMLCanvasElement) || !im.width) return false;
  const k = R / sp.disc.r;
  cx.globalAlpha = alpha == null ? 1 : alpha;
  cx.drawImage(im, sx - sp.disc.cx * k, sy - sp.disc.cy * k, sp.w * k, sp.h * k);
  cx.globalAlpha = 1;
  return true;
}
const colCache = {};
function colA(hex, a) {
  if (!colCache[hex]) { const n = parseInt(hex.slice(1), 16); colCache[hex] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  const c = colCache[hex]; return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}
function strokePts(pts, color, alpha, width, dash) {
  if (pts.length < 2) return;
  cx.strokeStyle = colA(color, alpha); cx.lineWidth = width; cx.setLineDash(dash || []);
  cx.beginPath();
  for (let i = 0; i < pts.length; i++) { const [sx, sy] = worldToScreen(pts[i].x, pts[i].y); if (i) cx.lineTo(sx, sy); else cx.moveTo(sx, sy); }
  cx.stroke(); cx.setLineDash([]);
}
function circle(sx, sy, r, fill, stroke, width) {
  cx.beginPath(); cx.arc(sx, sy, Math.max(0.5, r), 0, TAU);
  if (fill) { cx.fillStyle = fill; cx.fill(); }
  if (stroke) { cx.strokeStyle = stroke; cx.lineWidth = width || 1; cx.stroke(); }
}

function draw(realDt) {
  const W = cv.clientWidth, H = cv.clientHeight;
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx.fillStyle = "#05070d"; cx.fillRect(0, 0, W, H);
  for (const s of stars) {
    const px = ((s.x * W - cam.x * cam.scale * 0.05) % W + W) % W, py = ((s.y * H - cam.y * cam.scale * 0.05) % H + H) % H;
    cx.fillStyle = `rgba(200,215,255,${s.a})`; cx.fillRect(px, py, s.r, s.r);
  }
  const sc = cam.scale;

  // authored rings, for worlds still on them
  for (const b of bodies) if (b.alive && !b.struck) {
    const [sx, sy] = worldToScreen(STAR.x, STAR.y);
    circle(sx, sy, b.orbitR * sc, null, "rgba(120,150,200,0.16)", 1);
  }
  // pockets: influence ring, dark well, sprite
  for (const p of POCKETS) {
    const [sx, sy] = worldToScreen(p.x, p.y);
    cx.setLineDash([3, 6]); circle(sx, sy, S.pocketInfluenceAU * sc, null, "rgba(180,140,255,0.18)", 1); cx.setLineDash([]);
    const R = S.pocketRadiusAU * sc;
    const g = cx.createRadialGradient(sx, sy, R * 0.6, sx, sy, R * 2.4);
    g.addColorStop(0, "rgba(120,80,200,0.35)"); g.addColorStop(1, "rgba(120,80,200,0)");
    circle(sx, sy, R * 2.4, g);
    if (!drawSprite("blackhole", sx, sy, R * 1.15)) circle(sx, sy, R, "#0a0612", "#b48cff", 1.5);
    cx.fillStyle = "rgba(200,180,255,0.55)"; cx.font = `10px "Share Tech Mono", monospace`; cx.textAlign = "center";
    cx.fillText(p.name.toUpperCase(), sx, sy + R + 14);
  }
  // the star
  {
    const [sx, sy] = worldToScreen(STAR.x, STAR.y), R = starR() * sc;
    const g = cx.createRadialGradient(sx, sy, R * 0.8, sx, sy, R * 3);
    g.addColorStop(0, "rgba(255,75,43,0.35)"); g.addColorStop(1, "rgba(255,75,43,0)");
    circle(sx, sy, R * 3, g);
    if (!drawSprite("sun", sx, sy, R, sunTinted)) circle(sx, sy, R, STAR.color);
  }
  // trails
  strokePts(ship.trail, "#4fc3f7", 0.3, 1);
  if (acb.mode === "free") strokePts(acb.trail, "#ffffff", 0.35, 1);
  for (const b of bodies) if (b.alive && b.struck) strokePts(b.trail, b.color, 0.4, 1);
  // the forecast
  if (ghost) {
    for (const w of ghost.worlds) strokePts(w.pts, w.color, 0.55, 1, [4, 4]);
    strokePts(ghost.acb, "#ffffff", 0.45, 1, [3, 5]);
    if (ghost.hit) { const [sx, sy] = worldToScreen(ghost.hit.x, ghost.hit.y); circle(sx, sy, 6, null, "rgba(255,255,255,0.7)", 1); }
  }
  // worlds
  for (const b of bodies) {
    if (!b.alive) continue;
    const [sx, sy] = worldToScreen(b.x, b.y), R = ballR(b) * sc;
    if (!drawSprite(b.sprite, sx, sy, R)) circle(sx, sy, R, b.color);
    if (b.struck) circle(sx, sy, R + 3, null, colA(b.color, 0.5), 1);
  }
  // the ACB
  if (acb.mode !== "lost") {
    const [sx, sy] = worldToScreen(acb.x, acb.y), R = S.acbRadiusAU * sc;
    if (acb.mode === "free") {
      const d = dist(ship.x, ship.y, acb.x, acb.y), rel = Math.hypot(ship.vx - acb.vx, ship.vy - acb.vy);
      const inside = d < S.captureRadiusAU, slow = rel < S.captureSpeed;
      const col = inside && slow ? "rgba(143,232,176,0.9)" : inside ? "rgba(232,180,99,0.8)" : "rgba(255,255,255,0.35)";
      cx.setLineDash([4, 4]); circle(sx, sy, S.captureRadiusAU * sc, null, col, 1.5); cx.setLineDash([]);
      if (inside) {
        cx.fillStyle = col; cx.font = `10px "Share Tech Mono", monospace`; cx.textAlign = "center";
        cx.fillText(slow ? "MATCHED" : "REL " + rel.toFixed(1) + " AU/yr", sx, sy - S.captureRadiusAU * sc - 6);
      }
    }
    const g = cx.createRadialGradient(sx, sy, R * 0.5, sx, sy, R * 2.2);
    g.addColorStop(0, "rgba(255,255,255,0.35)"); g.addColorStop(1, "rgba(255,255,255,0)");
    circle(sx, sy, R * 2.2, g);
    const b = cx.createRadialGradient(sx - R * 0.35, sy - R * 0.35, R * 0.1, sx, sy, R);
    b.addColorStop(0, "#ffffff"); b.addColorStop(0.7, "#dfe6f0"); b.addColorStop(1, "#8a97a8");
    circle(sx, sy, R, b);
  }
  // the ship
  {
    const [sx, sy] = worldToScreen(ship.x, ship.y);
    const L = Math.max(HULL_LEN * sc, 9);
    cx.save(); cx.translate(sx, sy); cx.rotate(ship.nose);
    const f = thrustVector();
    if (f) {
      // the plume points against the thrust, in hull space
      const nx = Math.cos(ship.nose), ny = Math.sin(ship.nose);
      const lon = f[0] * nx + f[1] * ny, lat = f[0] * ny - f[1] * nx;
      cx.strokeStyle = "rgba(255,180,90,0.9)"; cx.lineWidth = 2; cx.beginPath();
      cx.moveTo(-lon * L * 0.6, lat * L * 0.5); cx.lineTo(-lon * L * (1.2 + Math.random() * 0.4), lat * L * (0.9 + Math.random() * 0.3)); cx.stroke();
    }
    cx.beginPath(); cx.moveTo(L, 0); cx.lineTo(-L * 0.55, L * 0.5); cx.lineTo(-L * 0.3, 0); cx.lineTo(-L * 0.55, -L * 0.5); cx.closePath();
    cx.fillStyle = "#4fc3f7"; cx.fill();
    if (keys.shift) { cx.strokeStyle = "rgba(143,195,232,0.8)"; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(0, 0, L * 1.3, 0, TAU); cx.stroke(); }
    cx.restore();
    // charge bar and the cue
    const p = pendingShot();
    if (p && (charging || drag)) {
      const [ax, ay] = worldToScreen(acb.x, acb.y);
      const len = 30 + p[2] * 90;
      cx.strokeStyle = "rgba(255,255,255,0.8)"; cx.lineWidth = 3; cx.beginPath();
      cx.moveTo(ax - p[0] * (S.acbRadiusAU * sc + 8), ay - p[1] * (S.acbRadiusAU * sc + 8));
      cx.lineTo(ax - p[0] * (S.acbRadiusAU * sc + 8 + len), ay - p[1] * (S.acbRadiusAU * sc + 8 + len)); cx.stroke();
      cx.fillStyle = "rgba(20,30,50,0.8)"; cx.fillRect(sx - 30, sy + 22, 60, 6);
      cx.fillStyle = "#e8f0fa"; cx.fillRect(sx - 30, sy + 22, 60 * p[2], 6);
      if (S.forceArrows) drawForceArrows(p);
    }
  }
  // flashes
  for (const f of flashes) {
    const [sx, sy] = worldToScreen(f.x, f.y), k = f.t / 0.8;
    if (f.kind === "ring") circle(sx, sy, f.r * sc * (0.3 + k), null, colA(f.color, 1 - k), 2);
    else {
      cx.save(); cx.translate(sx, sy); cx.rotate(f.rot); cx.strokeStyle = colA(f.color, (1 - k) * 0.9); cx.lineWidth = 1.5;
      for (let i = 0; i < 6; i++) { cx.rotate(TAU / 6); cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(f.r * sc * (1 + k * 2), 0); cx.stroke(); }
      cx.restore();
    }
  }
  drawTimeBand(W, H);
  drawHud(W, H);
}

function arrow(x0, y0, x1, y1, color, width, dash) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  if (L < 2) return;
  cx.strokeStyle = color; cx.fillStyle = color; cx.lineWidth = width; cx.setLineDash(dash || []);
  cx.beginPath(); cx.moveTo(x0, y0); cx.lineTo(x1, y1); cx.stroke(); cx.setLineDash([]);
  const ux = dx / L, uy = dy / L, h = Math.min(9, L * 0.5);
  cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x1 - ux * h - uy * h * 0.5, y1 - uy * h + ux * h * 0.5);
  cx.lineTo(x1 - ux * h + uy * h * 0.5, y1 - uy * h - ux * h * 0.5); cx.closePath(); cx.fill();
}
function arrowLabel(x, y, text, color) {
  cx.font = `10px "Share Tech Mono", monospace`; cx.textAlign = "left";
  const w = cx.measureText(text).width;
  cx.fillStyle = "rgba(5,7,13,0.75)"; cx.fillRect(x + 4, y - 9, w + 6, 13);
  cx.fillStyle = color; cx.fillText(text, x + 7, y + 1);
}
// The free-body diagram on the cue ball. See the header: one pixel scale for all of it.
function drawForceArrows(p) {
  const [ax0, ay0] = worldToScreen(acb.x, acb.y);
  const k = S.arrowPxPerAUyr;
  const shipV = [ship.vx * S.inheritFrac, ship.vy * S.inheritFrac];   // what the ball keeps
  const cueV = [p[0] * p[2] * S.shotPower, p[1] * p[2] * S.shotPower];
  const g = gravityAt(acb.x, acb.y, S.acbFeelsWorlds);
  const gravV = [g.ax * S.gravityHorizonYr, g.ay * S.gravityHorizonYr];
  // the ship's tip, then the cue added to it: the resultant runs from the ball to t2
  const t1 = [ax0 + shipV[0] * k, ay0 + shipV[1] * k];
  const t2 = [t1[0] + cueV[0] * k, t1[1] + cueV[1] * k];
  const tg = [ax0 + gravV[0] * k, ay0 + gravV[1] * k];
  arrow(ax0, ay0, t1[0], t1[1], "#4fc3f7", 2);
  arrow(ax0, ay0, t2[0], t2[1], "#8fe8b0", 2, [5, 4]);
  arrow(ax0, ay0, tg[0], tg[1], "#ffa040", 2);
  // Labels sit at midpoints, pushed to opposite sides of the line, because the ship and
  // cue arrows are often near-collinear and tip labels would stack on each other.
  const side = (a, b, sgn) => { const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
    return [(a[0] + b[0]) / 2 - dy / L * 14 * sgn, (a[1] + b[1]) / 2 + dx / L * 14 * sgn]; };
  const sm = side([ax0, ay0], t1, 1), n = S.arrowNumbers;
  arrowLabel(sm[0], sm[1], "ship" + (n ? " " + Math.hypot(...shipV).toFixed(1) + " AU/yr" : ""), "#4fc3f7");
  if (n) arrowLabel(t2[0], t2[1], Math.hypot(shipV[0] + cueV[0], shipV[1] + cueV[1]).toFixed(1) + " AU/yr", "#8fe8b0");
  arrowLabel(tg[0], tg[1] + 14, "gravity: " + g.top + (n ? " +" + Math.hypot(...gravV).toFixed(2) + " AU/yr in " + S.gravityHorizonYr + " yr" : ""), "#ffa040");
}
function drawTimeBand(W, H) {
  const R = W * 1.1, cxp = W / 2, cyp = H - R - 90;
  const span = 0.38;
  cx.strokeStyle = "rgba(120,150,200,0.25)"; cx.lineWidth = 5;
  cx.beginPath(); cx.arc(cxp, cyp, R, Math.PI / 2 - span / 2, Math.PI / 2 + span / 2); cx.stroke();
  const na = Math.PI / 2;
  cx.strokeStyle = "rgba(160,190,240,0.5)"; cx.lineWidth = 2;
  cx.beginPath(); cx.moveTo(cxp, cyp + R - 10); cx.lineTo(cxp, cyp + R + 10); cx.stroke();
  const a = Math.PI / 2 + span / 2 - span * sliderShown;
  const bx = cxp + Math.cos(a) * R, by = cyp + Math.sin(a) * R;
  const g = cx.createRadialGradient(bx, by, 0, bx, by, 16);
  g.addColorStop(0, "rgba(190,220,255,0.95)"); g.addColorStop(1, "rgba(120,170,255,0)");
  circle(bx, by, 16, g); circle(bx, by, 4, "#e8f0fa");
  cx.fillStyle = "rgba(160,185,215,0.8)"; cx.font = `12px "Share Tech Mono", monospace`; cx.textAlign = "center";
  const w = warpNow();
  cx.fillText(w < 1000 ? w.toFixed(0) + "x" : w < 1e6 ? (w / 1000).toFixed(0) + "K" : (w / 1e6).toFixed(1) + "M", W / 2, H - 64);
  cx.textAlign = "left";
}
function drawHud(W, H) {
  cx.font = `12px "Share Tech Mono", monospace`; cx.textAlign = "left";
  const alive = bodies.filter(b => b.alive).length;
  const lines = [
    ["SHOTS " + score.shots + "   FOULS " + score.fouls + "   POTTED " + score.potted + "/" + bodies.length +
     "   BALLS LEFT " + Math.max(0, S.maxLostBalls - score.lost), score.lost >= S.maxLostBalls - 1 ? "#ff8c70" : "#cfe0ff"],
    ["T " + simYears.toFixed(2) + " yr" + (score.deaths ? "   SHIP LOST " + score.deaths : ""), "#9fb4cc"],
    ["MODE " + (S.dragMode ? "DRAG (pull back)" : "CHARGE (hold LMB)") + "   Tab swaps", "#8fc3e8"],
    ["ACB " + (acb.mode === "attached" ? "ON THE NOSE" : acb.mode === "free" ? "FREE, go and catch it" :
              acb.mode === "capturing" ? "WINCHING IN" : score.failed ? "NONE LEFT" : "LOST, new one in " + Math.max(0, S.respawnSeconds - acb.lostT).toFixed(1) + " s"),
     acb.mode === "attached" ? "#e8f0fa" : acb.mode === "lost" ? "#ff5030" : "#8fe8b0"],
    stab ? ["STABILISER burning, " + stab.err.toFixed(2) + " AU/yr to go.  WASD or Shift to override", "#e8b463"] : null,
  ].filter(Boolean);
  lines.forEach((l, i) => { cx.fillStyle = l[1]; cx.fillText(l[0], 14, 22 + i * 17); });
  notices.forEach((n, i) => { cx.fillStyle = colA(n.color, Math.min(1, (20 - n.t) / 4)); cx.fillText(n.text, 14, H - 20 - (notices.length - 1 - i) * 16); });
  cx.fillStyle = "rgba(120,140,170,0.6)"; cx.textAlign = "right";
  cx.fillText("WASD fly  Shift drift  Q/E time  LMB shoot  Tab mode  C camera  R reset  H panel", W - 14, H - 14);
  cx.textAlign = "left";
  if (score.won) {
    cx.fillStyle = "rgba(5,7,13,0.6)"; cx.fillRect(W / 2 - 200, H / 2 - 50, 400, 90);
    cx.strokeStyle = "#ffe08a"; cx.strokeRect(W / 2 - 200, H / 2 - 50, 400, 90);
    cx.fillStyle = "#ffe08a"; cx.font = `20px "Share Tech Mono", monospace`; cx.textAlign = "center";
    cx.fillText("TABLE CLEARED", W / 2, H / 2 - 14);
    cx.font = `12px "Share Tech Mono", monospace`;
    cx.fillText(score.shots + " shots, " + score.fouls + " fouls, " + score.wonAt.toFixed(2) + " yr.  R to rack again", W / 2, H / 2 + 14);
    cx.textAlign = "left";
  }
  if (score.failed && !score.won) {
    cx.fillStyle = "rgba(5,7,13,0.6)"; cx.fillRect(W / 2 - 200, H / 2 - 50, 400, 90);
    cx.strokeStyle = "#ff5030"; cx.strokeRect(W / 2 - 200, H / 2 - 50, 400, 90);
    cx.fillStyle = "#ff5030"; cx.font = `20px "Share Tech Mono", monospace`; cx.textAlign = "center";
    cx.fillText("TABLE FAILED", W / 2, H / 2 - 14);
    cx.font = `12px "Share Tech Mono", monospace`;
    cx.fillText(S.maxLostBalls + " cue balls lost, " + score.potted + " potted.  R to rack again", W / 2, H / 2 + 14);
    cx.textAlign = "left";
  }
  if (paused) { cx.fillStyle = "#e8f0fa"; cx.font = `16px "Share Tech Mono", monospace`; cx.textAlign = "center"; cx.fillText("PAUSED", W / 2, 40); cx.textAlign = "left"; }
}

// ============================== INPUT ===========================================
const KEYMAP = { KeyW: "w", KeyA: "a", KeyS: "s", KeyD: "d", KeyQ: "q", KeyE: "e", ShiftLeft: "shift", ShiftRight: "shift" };
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  if (e.code === "Tab") { S.dragMode = !S.dragMode; charging = false; charge = 0; drag = null; saveSettings(); buildPanel(); e.preventDefault(); }
  if (e.code === "KeyC") { S.camFollow = !S.camFollow; saveSettings(); buildPanel(); }
  if (e.code === "KeyR") resetWorld();
  if (e.code === "KeyP") paused = !paused;
  if (e.code === "KeyH") { const p = document.getElementById("panel"); p.style.display = p.style.display === "none" ? "" : "none"; }
  if (e.code === "Escape") { charging = false; charge = 0; drag = null; }
});
addEventListener("keyup", e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
cv.addEventListener("mousemove", e => { mouse.sx = e.clientX; mouse.sy = e.clientY; });
cv.addEventListener("mousedown", e => {
  if (e.button !== 0 || acb.mode !== "attached") return;
  if (S.dragMode) drag = { ax: e.clientX, ay: e.clientY };
  else { charging = true; charge = 0; }
});
addEventListener("mouseup", e => {
  if (e.button !== 0) return;
  const p = pendingShot();
  if (S.dragMode && drag) { if (p && p[2] > 0.02) fireAcb(p[0], p[1], p[2]); drag = null; }
  else if (charging) { if (p) fireAcb(p[0], p[1], Math.max(0.08, p[2])); charging = false; charge = 0; }
});
cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("wheel", e => { cam.zoom = Math.max(0.4, Math.min(6, cam.zoom * Math.exp(-e.deltaY * 0.0012))); e.preventDefault(); }, { passive: false });

function fmtLog(v) { return v < 100 ? v.toFixed(1) : v.toFixed(0); }
function buildPanel() {
  const el = document.getElementById("panel");
  let html = "";
  for (const row of PANEL) {
    if (row[0] === "h") { html += `<h1>${row[1]} <span id="collapse">[-]</span></h1><div id="panelBody">`; continue; }
    if (row[0] === "-") { html += "<hr>"; continue; }
    const [kind, key, label, min, max, step] = row;
    // "l" is a log-scaled range: the slider travels an exponent, so each doubling gets
    // the same room and the slow end is not three pixels wide.
    if (kind === "l") {
      const t = Math.log(S[key] / min) / Math.log(max / min);
      html += `<div class="row"><label><span>${label}</span><input type="range" data-k="${key}" data-log="${min},${max}" min="0" max="1" step="0.001" value="${t}"><span class="val" id="v_${key}">${fmtLog(S[key])}</span></label></div>`;
    } else if (kind === "b")
      html += `<div class="row"><label><span>${label}</span><input type="checkbox" data-k="${key}" ${S[key] ? "checked" : ""}></label></div>`;
    else
      html += `<div class="row"><label><span>${label}</span><input type="range" data-k="${key}" min="${min}" max="${max}" step="${step}" value="${S[key]}"><span class="val" id="v_${key}">${S[key]}</span></label></div>`;
  }
  html += `<hr><button id="resetBtn">reset to defaults</button></div>`;
  el.innerHTML = html;
  el.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", () => {
      const k = inp.dataset.k;
      let shown = inp.value;
      if (inp.dataset.log) {
        const [lo, hi] = inp.dataset.log.split(",").map(Number);
        S[k] = lo * Math.pow(hi / lo, parseFloat(inp.value));
        shown = fmtLog(S[k]);
      } else S[k] = inp.type === "checkbox" ? inp.checked : parseFloat(inp.value);
      const v = document.getElementById("v_" + k);
      if (v) v.textContent = shown;
      saveSettings();
    });
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    localStorage.removeItem(STORE_KEY); S = { ...DEFAULTS }; buildPanel();
  });
  document.getElementById("collapse").addEventListener("click", () => {
    const b = document.getElementById("panelBody");
    b.style.display = b.style.display === "none" ? "" : "none";
  });
}
buildPanel();

// The headless-test handle: top-level let/const never reach window, so a scripted
// check reads and pokes the rig through this. Not for play.
window.RIG = {
  state: () => ({ simYears, sliderT, warp: warpNow(),
                  ship: { x: ship.x, y: ship.y, vx: ship.vx, vy: ship.vy, nose: ship.nose },
                  acb: { mode: acb.mode, x: acb.x, y: acb.y, vx: acb.vx, vy: acb.vy, dwell: acb.dwell },
                  bodies: bodies.map(b => ({ name: b.name, x: b.x, y: b.y, vx: b.vx, vy: b.vy, alive: b.alive, struck: b.struck })),
                  pockets: POCKETS.map(p => ({ name: p.name, x: p.x, y: p.y })),
                  score: { ...score }, notices: notices.map(n => n.text),
                  ghost: ghost ? { pts: ghost.acb.length, hit: ghost.hit, worlds: ghost.worlds.length } : null }),
  settings: () => S,
  stab: () => stab,
  set: (k, v) => { S[k] = v; },
  reset: resetWorld,
  setNose: a => { ship.nose = a; },
  fire: (dx, dy, p) => fireAcb(dx, dy, p),
  step: (yr) => { const n = Math.ceil(yr / MAX_SUBSTEP_YR), h = yr / n; for (let i = 0; i < n; i++) { stabiliseStep(h); simStep(h, false); } simYears += yr; if (acb.mode === "attached") placeAcbOnNose(); },
  teleportShip: (x, y, vx, vy) => { ship.x = x; ship.y = y; ship.vx = vx; ship.vy = vy; },
  key: (k, down) => { keys[k] = down; },
  override: (why) => overrideStabiliser(why),
  teleportBody: (i, x, y, vx, vy, struck) => { const b = bodies[i]; b.x = x; b.y = y; b.vx = vx; b.vy = vy; if (struck != null) b.struck = struck; },
  ghostNow: () => { buildGhost(); return ghost ? { pts: ghost.acb.length, hit: ghost.hit, worlds: ghost.worlds.length } : null; },
  realTick: (s) => { checkCapture(s); stepCapture(s); stepLost(s); },
};

resetWorld();
requestAnimationFrame(frame);
</script>
