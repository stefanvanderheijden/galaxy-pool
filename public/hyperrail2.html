<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Hyper Rail 2 feel rig</title>
<!--
  HYPER RAIL 2. A VARIANT of hyperrail.html, not a replacement: keep both, play them back
  to back, the same way hyperwarp2 sits beside hyperwarp. Everything about the world, the
  chart, the shot and the conventions is hyperrail 1 and is documented there. What changed
  is the control model, and it changed because the two models cannot both be true at once.

  IN HYPERRAIL 1 THE THROTTLE IS THE STEERING. W and S thrust along the line, the speed
  mismatch against the line's hold speed drives the ship across the ladder, and
  conservation charges the climb. That model is good and it stays in file 1 untouched.

  IN HYPERRAIL 2 THE HAND PICKS THE LINE AND THE THROTTLE ONLY SETS THE PACE. The designer
  asked for A and D to change rail and W and S to be thrust forward and back along the
  line. Both cannot steer: if A/D move you between lines and a speed mismatch also
  migrates you, two controls fight over one quantity and the ship answers neither. So the
  split is stated once, here, and the code holds to it:

    1. A AND D CHANGE RAIL, one line at a time, LEFT AND RIGHT FROM THE SHIP'S POINT OF
       VIEW. Not outward and inward. Which line you get depends on which way you are
       running along the current one, so the same key takes you up the well on one heading
       and down it on the opposite heading. See stepRail for the sign derivation; the short
       version is that the ship's right-hand side is -dir * gradient, so with dir = +1 the
       right-hand rail is the deeper one and with dir = -1 it is the shallower one.
    2. W AND S ARE A THROTTLE ALONG THE LINE, AND THE RAIL HOLDS YOU. You run faster or
       slower than the line's natural hold speed and you stay on the line anyway. The rail
       supplies whatever cross-line force the mismatch leaves unpaid. That is the assist
       stated plainly, and GAME_DESIGN 5.6 is the section it answers to. rail.m is now a
       readout of how hard the rail is working, not a control.
    3. A RAIL CHANGE IS AN EASED SWEEP, NEVER A SNAP. The target is a drawn rung; the level
       eases toward it with a rate that ramps in and ramps out. Holding the key keeps
       pushing the target further ahead at railChangeRate rungs per second, so one hold is
       one continuous motion across many lines rather than a queue of one animation per
       press.
    4. THE CHANGE IS STILL CHARGED BY CONSERVATION: v1^2 = v0^2 + 2*(phi0 - phi1). Moving
       to a shallower line costs speed and moving to a deeper one pays it. Rail changes are
       not free, and a change you cannot afford is refused at the moment you ask for it
       rather than silently floored.

  THREE THINGS THE DESIGNER ADDED AFTER THE FIRST PASS:

    5. FREE FLIGHT BLEEDS MOMENTUM. linearDamp already existed and already ran only while
       free; it was set to 0.9 per second, which reads as a long coast. It is 1.8 here, so
       speed halves in 0.39 s and is down to 3% in 2 s, and letting go of the keys brings
       the ship to rest instead of leaving it drifting. It must never act while railed: the
       rail owns the speed there and damping would fight the throttle every step.
    6. RMB TELEPORTS, AND ONLY IN FREE FLIGHT. hyperrail 1 left the teleport out because it
       owns the ship's state and the rail is a second claimant. Gating it to free flight is
       exactly that objection answered, so it comes back from hyperwarp2 unchanged, cost
       and blocks and both flares included. RAILED, RMB DOES NOTHING AT ALL: no jump and no
       rail break. A control that silently drops you off the rail is worse than one that
       does nothing.
    7. THE MODE ANNOUNCES ITSELF FROM BOTH SIDES. Engaging free flight logs "ANTIGRAV
       FREEFLIGHT ENABLED" and leaving it logs "ORBIT-GUIDED NAVIGATION ENABLED". They are
       one instrument reporting its state, so they post on the transition and never every
       frame, and the second wording is the one that says the rail is a mode rather than a
       restriction. Do not paraphrase it.

  KEPT FROM HYPERRAIL 1 EXACTLY: snapped is the resting state and not a mode you engage;
  only lines you can see are ridable; Shift is antigravity free flight with an eased
  re-acquire; the nose follows the tangent while railed and the cursor while free; no
  forecast while railed; the deepest line round a living world is its orbit; the road trip
  framing and the pool shot. Conventions are the game's: AU, solar masses, Julian years,
  G = 4*pi^2, doubles, +y DOWN, the cv.style.width/height retina fix, and a window.RIG hook
  in the same shape. The storage key is hyperrail2.v1, so the two rigs cannot share saved
  settings.

  WHAT THIS MODEL MAKES AMBIGUOUS, and it is worth the designer's attention:
    - "Left" only exists while the ship has a heading, and on a rail there is no reverse.
      To come about you hold Shift, turn, and let go, which is hyperrail 1's rule unchanged.
      So reversing is a two-step move and the A/D mapping flips underneath it.
    - The throttle no longer buys altitude, so W is now only "get there sooner". Whether
      that is enough of a reason to touch it is the thing to find out in play.
    - The rail eating the mismatch means there is no speed you can be going that takes you
      off the line, so the only way to lose the line is Shift. That is a bigger assist than
      hyperrail 1's, by design, and it is the thing to judge.

  CONTROLS
    A / D          change rail: one line to the ship's LEFT / RIGHT. Hold to keep going
    W / S          throttle along the line: faster / slower. The line holds you either way
    SHIFT hold     let go: antigravity free flight, and momentum bleeds off
    RMB            free flight only: teleport to the cursor, momentum kept
    MOUSE          aims the nose ONLY in free flight. On a rail the nose follows the line
    Q / E hold     time slider, 1x..5,000,000x, springs back to 100,000x
    LMB hold       charge the particle accelerator; release to fire the pool shot
    ESC            cancel a held charge
    SCROLL / R / P zoom / reset / pause

  IN FREE FLIGHT W/S drive along the nose and A/D strafe, which is hyperwarp2 unchanged.

  ONE SOFTENING, TWO USES, and it is worth knowing. potential() is used for the ink, for
  the hold speed and for the projection onto a line, so those three can never disagree.
  Free flight uses the sim's own SOFT2, which is smaller. The same asymmetry exists in
  the game (Surf.cs records it): the two agree everywhere the ship actually flies and
  disagree only at a core, where nothing is ridable anyway.
-->
<style>

  canvas { display: block; }
  #panel {

    background: rgba(8, 10, 18, 0.92); border: 1px solid #2a3448; border-radius: 6px;
